<script>
(function () {
  try {
    var raw = localStorage.getItem("brian-theme");
    /* O index.html grava o tema como texto simples ("dark"); versões antigas
       gravavam JSON. Aceita os dois, senão o modo escuro não atravessa telas. */
    var choice = "system";
    if (raw) {
      if (raw === "dark" || raw === "light" || raw === "system") choice = raw;
      else choice = (JSON.parse(raw).state || {}).choice || "system";
    }
    var dark = choice === "dark" ||
      (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>

@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* A tela de autenticação é sempre clara, mesmo com o tema escuro escolhido. */
.auth{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg-auth-splash)}
.auth-header{width:100%;display:flex;align-items:flex-start;padding:32px 32px 0}

.auth-logo-mark{width:27px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#1D1F23;color:#fff;font-size:14px;line-height:24px;font-weight:700}
.auth-body{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 32px 32px}
@media(max-width:479px){.auth-body{align-items:flex-start;padding:48px 16px 24px}}

.auth-form{width:100%;max-width:416px;min-width:0;display:flex;flex-direction:column;align-items:stretch;padding:32px;border-radius:24px;background:var(--color-bg-surface);overflow-x:auto;overflow-y:clip;animation:sobe 260ms ease}
@media(prefers-reduced-motion:reduce){.auth-form{animation:none}}
@media(max-width:479px){.auth-form{padding:28px 24px}}

.auth-cab{width:100%;display:flex;flex-direction:column;gap:8px}
.auth-titulo{width:100%;color:var(--color-text-primary);font-size:24px;line-height:28px;font-weight:700;letter-spacing:0}
.auth-desc{width:100%;color:var(--color-text-muted);font-size:16px;line-height:24px;font-weight:500}

.auth-campo{width:100%;display:flex;align-items:flex-start;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--border-hairline)}

.auth-rot{width:100%;color:var(--color-text-muted);font-size:14px;line-height:20px;font-weight:700}
.auth-input{width:100%;height:24px;padding:0;border:0;outline:0;background:transparent;color:var(--color-text-primary);font-family:inherit;font-size:16px;line-height:24px;font-weight:500}
.auth-input::placeholder{color:var(--color-text-muted)}
.auth-olho{width:24px;height:24px;flex-shrink:0;align-self:center;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;cursor:pointer}
.auth-olho::before{content:"";width:24px;height:24px;background-color:var(--color-text-muted);-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-image:var(--ic-olho);mask-image:var(--ic-olho)}
.auth-olho.is-off::before{-webkit-mask-image:var(--ic-olho-off);mask-image:var(--ic-olho-off)}

.auth-erro{width:100%;color:var(--color-feedback-error);font-size:14px;line-height:20px;font-weight:700;text-align:center;min-height:20px;padding-top:12px}

.auth-acoes{width:100%;display:flex;flex-direction:column;gap:8px;padding-top:16px}
.auth-btn{width:100%;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:64px;font-family:inherit;font-size:16px;line-height:24px;font-weight:700;cursor:pointer}
.auth-btn:disabled{cursor:not-allowed;opacity:.72}
.auth-btn--principal{border:2px solid var(--color-text-primary);background:var(--color-text-primary);color:var(--color-text-inverse)}
.auth-btn--secundario{border:2px solid var(--border-hairline);background:var(--color-bg-surface);color:var(--color-text-primary)}
.auth-btn--link{border:0;background:transparent;color:var(--color-text-primary)}

   b < -R           → vermelho  (lowest)
   -R <= b < 0      → rosa      (low)
   0 <= b <= R      → areia     (base)
   R < b <= 2R      → menta     (high)
   b > 2R           → verde     (highest)                     */
const REFERENCIA = Number(ls.get('brian-referencia')) || 1000;



let SB = null;
let modo = 'entrar';   /* entrar | criar | recuperar */

const $ = id => document.getElementById(id);
const erro = () => $('erro');

function setModo(novo){
  modo = novo;
  const senha = $('fSenha').closest('.auth-campo');
  erro().textContent = '';
  if (modo === 'entrar'){
    $('titulo').textContent = 'entrar';
    $('desc').textContent   = 'seu controle financeiro pessoal';
    $('btnEntrar').textContent = 'entrar';
    $('btnCriar').textContent  = 'criar conta';
    $('btnEsqueci').textContent = 'esqueci minha senha';
    senha.hidden = false;
    $('fSenha').setAttribute('autocomplete','current-password');
  } else if (modo === 'criar'){
    $('titulo').textContent = 'criar conta';
    $('desc').textContent   = 'a senha precisa ter ao menos 6 caracteres';
    $('btnEntrar').textContent = 'criar conta';
    $('btnCriar').textContent  = 'já tenho conta';
    $('btnEsqueci').textContent = 'esqueci minha senha';
    senha.hidden = false;
    $('fSenha').setAttribute('autocomplete','new-password');
  } else {
    $('titulo').textContent = 'recuperar senha';
    $('desc').textContent   = 'enviamos um link para o seu e-mail';
    $('btnEntrar').textContent = 'enviar link';
    $('btnCriar').textContent  = 'voltar para entrar';
    $('btnEsqueci').textContent = '';
    $('btnEsqueci').hidden = true;
    senha.hidden = true;
  }
  if (modo !== 'recuperar') $('btnEsqueci').hidden = false;
}

/* Mensagens do Supabase vêm em inglês e cruas; traduz as que o usuário
   realmente encontra e deixa o resto passar em vez de engolir o motivo. */
function traduzir(msg){
  const m = String(msg || '').toLowerCase();
  if (m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed'))       return 'Confirme o e-mail antes de entrar.';
  if (m.includes('user already registered'))   return 'Esse e-mail já tem conta. Tente entrar.';
  if (m.includes('password should be at least')) return 'A senha precisa ter ao menos 6 caracteres.';
  if (m.includes('unable to validate email'))  return 'E-mail inválido.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Espere um pouco.';
  return msg || 'Não deu para completar. Tente de novo.';
}

async function enviar(e){
  e.preventDefault();
  const btn   = $('btnEntrar');
  const email = $('fEmail').value.trim();
  const senha = $('fSenha').value;

  if (!email){ erro().textContent = 'Informe o e-mail.'; $('fEmail').focus(); return; }
  if (modo !== 'recuperar' && !senha){ erro().textContent = 'Informe a senha.'; $('fSenha').focus(); return; }

  erro().textContent = '';
  btn.disabled = true;
  const rotulo = btn.textContent;
  btn.textContent = 'aguarde…';

  try {
    if (!SB) throw new Error('sem conexão');
    if (modo === 'entrar'){
      const { error } = await SB.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
      location.replace('saldos.html');
      return;
    }
    if (modo === 'criar'){
      const { data, error } = await SB.auth.signUp({ email, password: senha });
      if (error) throw error;
      /* Com confirmação de e-mail ligada não vem sessão: dizer isso é melhor
         que mandar para uma tela que vai rebater para cá. */
      if (data.session){ location.replace('saldos.html'); return; }
      erro().textContent = 'Conta criada. Confirme o e-mail para entrar.';
    } else {
      const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href });
      if (error) throw error;
      erro().textContent = 'Link enviado. Confira seu e-mail.';
    }
  } catch (err) {
    erro().textContent = traduzir(err.message);
  }
  btn.disabled = false;
  btn.textContent = rotulo;
}

$('form').addEventListener('submit', enviar);
$('btnCriar').addEventListener('click', () => setModo(modo === 'entrar' ? 'criar' : 'entrar'));
$('btnEsqueci').addEventListener('click', () => setModo('recuperar'));
$('verSenha').addEventListener('click', () => {
  const i = $('fSenha'), b = $('verSenha');
  const mostrando = i.type === 'text';
  i.type = mostrando ? 'password' : 'text';
  b.classList.toggle('is-off', mostrando);
  b.setAttribute('aria-pressed', String(!mostrando));
  b.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
  i.focus();
});

async function boot(){
  try {
    SB = window.supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await SB.auth.getSession();
    /* Já autenticado não tem o que fazer aqui. */
    if (session){ location.replace('saldos.html'); return; }
  } catch (err) {
    erro().textContent = 'Não deu para falar com o servidor.';
  }
  setModo('entrar');
  $('fEmail').focus();
}

boot();
</script>
