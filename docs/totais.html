<title>totais</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var raw = localStorage.getItem("brian-theme");
    /* O index.html grava o tema como texto simples ("dark"); versões antigas
       gravavam JSON. Aceita os dois, senão o modo escuro não atravessa telas. */
    var choice = "system";
    if (raw) {
      if (raw === "dark" || raw === "light" || raw === "system") choice = raw;
      else choice = (JSON.parse(raw).state || {}).choice || "system";
    }
    var dark = choice === "dark" ||
      (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>

/* ══════════════════════════════════════════════════════════════
   RESET / BASE
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth;overscroll-behavior-x:contain}
body{margin:0;min-width:320px;min-height:100vh;background:var(--color-bg-canvas);color:var(--color-text-primary);font-family:"DM Sans",sans-serif;font-size:16px;line-height:24px;font-weight:400;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body,button,input,textarea,select{font-family:"DM Sans",sans-serif}
button,input,textarea,select{font:inherit}
a{color:inherit;text-decoration:none}
img,picture,svg,canvas{display:block;max-width:100%}
h1,h2,h3,h4,h5,h6,p{margin:0}
::selection{background:#DDFD5A;color:#0E2D23}
#root{min-height:100vh}

/* ══════════════════════════════════════════════════════════════
   SHELL
   ══════════════════════════════════════════════════════════════ */
.app-main{width:100%;min-height:100vh;padding-top:var(--banner-offset,0px);background:var(--color-bg-surface)}
.app-shell{width:100%;min-height:calc(100vh - var(--banner-offset,0px));height:calc(100vh - var(--banner-offset,0px));display:flex;background:var(--color-bg-surface);overflow:hidden}
@media(max-width:479px){.app-shell{height:calc(100dvh - var(--banner-offset,0px));min-height:calc(100dvh - var(--banner-offset,0px));flex-direction:column}}
.sidebar-wrap{display:flex;flex-shrink:0}
@media(max-width:479px){.sidebar-wrap{display:none}}
.content-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.desktop-header-wrap{display:block}
@media(max-width:479px){.desktop-header-wrap{display:none}}

/* ══════════════════════════════════════════════════════════════
   SIDEBAR (desktop)
   ══════════════════════════════════════════════════════════════ */
.sidebar{position:relative;z-index:40;width:144px;display:flex;flex-direction:column;padding:12px 0 4px;border-right:1px solid var(--border-hairline);background:var(--color-bg-surface);transition:width 260ms ease;will-change:width}
@media(max-width:479px){.sidebar{display:none}}
.sidebar.is-collapsed{width:56px}
.sidebar-logo{width:100%;display:flex;align-items:center;justify-content:flex-start;height:32px;padding:0 12px;margin-bottom:8px;border:0;background:transparent;cursor:pointer;transition:padding 260ms ease}
.sidebar.is-collapsed .sidebar-logo{justify-content:center;padding:0}
.sidebar-logo-mark{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;background:#FF5917;color:#fff;font-size:14px;line-height:24px;font-weight:700}
.sidebar-nav{display:flex;flex:1;flex-direction:column;gap:4px}
.sidebar-divider{height:1px;margin:4px 0;background:var(--border-hairline)}
.sidebar-item{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:8px;height:40px;padding:0 12px;border:0;background:transparent;color:var(--color-text-primary);font-size:14px;line-height:20px;font-weight:700;cursor:pointer;overflow:hidden;transition:padding 260ms ease,color 220ms ease}
.sidebar-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.sidebar-item.is-active{color:#FF5917}
.sidebar-item.is-active::before{background:#FF5917}
.sidebar-item:hover{background:var(--color-bg-subtle)}
.sidebar-item:focus-visible{outline:2px solid #FF5917;outline-offset:-2px}
.sidebar.is-collapsed .sidebar-item{justify-content:center;padding:0}
.sidebar-collapse{justify-content:flex-end;margin-top:auto}
.sidebar-label{display:inline-block;white-space:nowrap;overflow:hidden;max-width:72px;opacity:1;transform:translateX(0);transition:max-width 260ms ease,opacity 220ms ease,transform 260ms ease}
.sidebar.is-collapsed .sidebar-label{max-width:0;opacity:0;transform:translateX(-8px)}
.sidebar-icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-icon::before{content:"";width:24px;height:24px;background-color:currentColor;-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.sidebar-icon.ic-saldos::before{-webkit-mask-image:var(--ic-grid);mask-image:var(--ic-grid)}
.sidebar-icon.ic-totais::before{-webkit-mask-image:var(--ic-totals);mask-image:var(--ic-totals)}
.sidebar-icon.ic-tags::before{-webkit-mask-image:var(--ic-tags);mask-image:var(--ic-tags)}
.sidebar-icon.ic-menu::before{-webkit-mask-image:var(--ic-menu);mask-image:var(--ic-menu)}
.sidebar-icon.ic-collapse::before{-webkit-mask-image:var(--ic-dbl-left);mask-image:var(--ic-dbl-left)}
.sidebar.is-collapsed .sidebar-icon.ic-collapse::before{-webkit-mask-image:var(--ic-dbl-right);mask-image:var(--ic-dbl-right)}
.sidebar-add{position:relative;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background-color:var(--color-text-primary)}
.sidebar-add::after{content:"";width:14px;height:14px;background-color:var(--color-bg-surface);-webkit-mask-image:var(--ic-plus);mask-image:var(--ic-plus);-webkit-mask-size:14px 14px;mask-size:14px 14px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* glifo "ir pra hoje" */
.today-glyph{position:relative;width:24px;height:24px;flex-shrink:0}
.today-glyph .tg-pin-l{position:absolute;top:2px;left:5px;width:3px;height:2px;background:var(--color-text-primary)}
.today-glyph .tg-pin-r{position:absolute;top:2px;left:16px;width:3px;height:2px;background:var(--color-text-primary)}
.today-glyph .tg-bar{position:absolute;top:4px;left:2px;width:20px;height:2px;background:#FF5917}
.today-glyph .tg-num{position:absolute;top:6px;left:2px;width:20px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:0 0 2px 2px;background:var(--color-bg-subtle);color:var(--color-text-primary);font-size:12px;line-height:16px;font-weight:700}
/* mini-grade horizonte */
.horizon-mini{box-sizing:border-box;width:24px;height:24px;display:grid;grid-template-columns:20px;grid-template-rows:repeat(3,6px);gap:1px;padding:2px;flex-shrink:0;overflow:hidden;background:var(--color-bg-surface)}
.horizon-mini > span:first-child{border-radius:4px 4px 0 0}
.horizon-mini > span:last-child{border-radius:0 0 4px 4px}
.hm-neutral{background:var(--color-bg-subtle)}
.hm-lowest{background:var(--color-balance-red)}
.hm-low{background:var(--color-balance-rose)}
.hm-base{background:var(--color-balance-sand)}
.hm-high{background:var(--color-balance-mint)}
.hm-highest{background:var(--color-balance-green)}

/* ══════════════════════════════════════════════════════════════
   HEADER DESKTOP
   ══════════════════════════════════════════════════════════════ */
.desktop-header{text-transform:lowercase;min-height:56px;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--border-hairline);background:var(--color-bg-surface)}
.dh-title-wrap{flex:1 1 0;min-width:0;display:flex;align-items:center}
.dh-title{color:var(--color-text-primary);font-size:20px;line-height:24px;font-weight:700;white-space:nowrap}
.dh-nav{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;gap:8px}
.dh-nav-btn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.dh-nav-btn:hover{background:var(--color-bg-subtle)}
.dh-nav-btn:focus-visible{outline:2px solid #FF5917;outline-offset:4px}
.dh-nav-btn::before{content:"";width:24px;height:24px;background-color:#91949A;-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.dh-nav-btn.nav-dbl-prev::before{-webkit-mask-image:var(--ic-dbl-left);mask-image:var(--ic-dbl-left)}
.dh-nav-btn.nav-prev::before{-webkit-mask-image:var(--ic-chevron-left);mask-image:var(--ic-chevron-left)}
.dh-nav-btn.nav-next::before{-webkit-mask-image:var(--ic-chevron-right);mask-image:var(--ic-chevron-right)}
.dh-nav-btn.nav-dbl-next::before{-webkit-mask-image:var(--ic-dbl-right);mask-image:var(--ic-dbl-right)}
.dh-range-pill{min-width:clamp(200px,18vw,250px);height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px 0 14px;border:2px solid var(--color-border-subtle);border-radius:999px;background:var(--color-bg-surface);cursor:pointer}
.dh-range-pill:focus-visible{outline:2px solid #FF5917;outline-offset:2px}
.dh-range-label{color:var(--color-text-primary);font-size:16px;line-height:20px;font-weight:700;white-space:nowrap}
.dh-chevron{width:24px;height:24px;flex-shrink:0;background-color:#91949A;-webkit-mask-image:var(--ic-chevron-down);mask-image:var(--ic-chevron-down);-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

/* ══════════════════════════════════════════════════════════════
   HEADER MOBILE
   ══════════════════════════════════════════════════════════════ */
.mobile-header{text-transform:lowercase;display:none}

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://cathhujdhocioybdpnvc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhdGhodWpkaG9jaW95YmRwbnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTUxODgsImV4cCI6MjA5MTI5MTE4OH0.5zO8sxWV1R_fVt9FPN4bDGXaCophee4gCh0jjEVp9DQ';

/* localStorage seguro: navegação privada, webviews e data: URLs bloqueiam Storage. */
const ls = {
  get(k, fallback = null){ try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch(e){ return fallback; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  json(k, fallback){ try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch(e){ return fallback; } },
};

/* Referência que define as faixas de cor do saldo.
   b < -R           → vermelho  (lowest)
   -R <= b < 0      → rosa      (low)
   0 <= b <= R      → areia     (base)
   R < b <= 2R      → menta     (high)
   b > 2R           → verde     (highest)                     */
const REFERENCIA = Number(ls.get('brian-referencia')) || 1000;

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_CAP = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const METRICS = [
  { key:'income',    label:'entradas',  icon:'mi-income'    },
  { key:'expense',   label:'saídas',    icon:'mi-expense'   },
  { key:'recurring', label:'diários',   icon:'mi-recurring' },
  { key:'savings',   label:'economias', icon:'mi-savings'   },
  { key:'card',      label:'cartão',    icon:'mi-card'      },
];

/* ══════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════ */
const HOJE = new Date();
const HOJE_KEY = iso(HOJE);

const S = {
  ano: HOJE.getFullYear(),
  mes: HOJE.getMonth(),
  metric: ls.get('brian-saldos-metric', 'card'),
  collapsed: new Set(ls.json('brian-saldos-collapsed', [])),
  checkins: new Set(ls.json('brian-checkins', [])),
  movs: [],
  saldoInicial: 0,
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function diasNoMes(y,m){ return new Date(y, m+1, 0).getDate(); }
function fmt(v){
  const n = Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (v < 0 ? '-R$ ' : 'R$ ') + n;
}
function tone(saldo){
  if (saldo < -REFERENCIA)  return 'lowest';
  if (saldo < 0)            return 'low';
  if (saldo <= REFERENCIA)  return 'base';
  if (saldo <= REFERENCIA*2)return 'high';
  return 'highest';
}
function metricInfo(key){ return METRICS.find(m => m.key === key) || METRICS[4]; }

/* ══════════════════════════════════════════════════════════════
   CLASSIFICAÇÃO — mesma regra do index.html
   ══════════════════════════════════════════════════════════════ */
function classify(mv){
  if (mv.tipo === 'entrada')                       return 'income';
  if (mv.conta === 'cartao')                       return 'card';
  /* 'itau' era o apelido interno deste bolso, herdado do app de referência.
     Segue aceito porque o index.html antigo ainda grava assim. */
  if (mv.conta === 'economias' || mv.conta === 'itau' ||
      mv.tag === 'invest')                           return 'savings';
  if (mv.tag === 'diário' || mv.tag === 'diario')  return 'recurring';
  return 'expense';
}
/* Constrói o ano inteiro: 12 meses × dias, com saldo acumulado. */
function buildYear(ano){
  const porDia = new Map();
  for (const mv of S.movs){
    const k = iso(mv.data);
    if (!porDia.has(k)) porDia.set(k, { income:0, expense:0, recurring:0, savings:0, card:0, delta:0 });
    const bucket = porDia.get(k);
    const kind = classify(mv);
    bucket[kind] += mv.valor;
    bucket.delta += (mv.tipo === 'entrada' ? mv.valor : -mv.valor);
  }

  // saldo acumulado desde o começo até 31/dez do ano anterior
  let saldo = S.saldoInicial;
  for (const [k, b] of [...porDia.entries()].sort()){
    if (k < ano + '-01-01') saldo += b.delta;
  }

  const meses = [];
  for (let m = 0; m < 12; m++){
    const dias = [];
    const tot = { income:0, expense:0, recurring:0, savings:0, card:0 };
    const n = diasNoMes(ano, m);
    for (let d = 1; d <= n; d++){
      const date = new Date(ano, m, d);
      const k = iso(date);
      const b = porDia.get(k) || { income:0, expense:0, recurring:0, savings:0, card:0, delta:0 };
      saldo += b.delta;
      for (const key of Object.keys(tot)) tot[key] += b[key];
      const wd = date.getDay();
      dias.push({
        d, key:k, date,
        weekend: wd === 0 || wd === 6,
        isToday: k === HOJE_KEY,
        values: { income:b.income, expense:b.expense, recurring:b.recurring, savings:b.savings, card:b.card },
        saldo,
        tone: tone(saldo),
      });
    }
    meses.push({ m, dias, tot });
  }
  return meses;
}
/* ══════════════════════════════════════════════════════════════
   HORIZONTE (mini-grades)
   ══════════════════════════════════════════════════════════════ */
function paintHorizon(meses){
  const flat = meses.flatMap(m => m.dias).filter(d => d.key >= HOJE_KEY);
  const pick = n => Array.from({length:n}, (_,i) => flat[Math.floor(i * flat.length / n)] || null);

  const side = document.getElementById('sidebarHorizon');
  side.innerHTML = pick(3).map(d =>
    `<span class="hm-${d ? d.tone : 'neutral'}"${d ? ` data-horizon-date="${d.key}" data-horizon-tone="${d.tone}"` : ''}></span>`
  ).join('');

  const mob = document.getElementById('mobileHorizon');
  mob.innerHTML = pick(9).map(d =>
    `<span class="hm-${d ? d.tone : 'neutral'}"${d ? ` data-horizon-date="${d.key}" data-horizon-tone="${d.tone}"` : ''}></span>`
  ).join('');
}

function toMov(r){

    valor: parseFloat(r.valor),
    tipo:  r.tipo,

/* ══════════════════════════════════════════════════════════════
   AGREGAÇÃO DO MÊS
   ══════════════════════════════════════════════════════════════ */
/* mes === null agrega o ano inteiro. O resto do cálculo é idêntico — só muda
   a janela e quantos dias já passaram dentro dela. */
function totaisDoPeriodo(ano, mes){
  const t = { income:0, expense:0, recurring:0, savings:0, card:0 };
  const diasVistos = new Set();
  for (const mv of S.movs){
    if (mv.data.getFullYear() !== ano) continue;
    if (mes !== null && mv.data.getMonth() !== mes) continue;
    const kind = classify(mv);
    t[kind] += mv.valor;
    if (kind === 'recurring') diasVistos.add(iso(mv.data));
  }

  /* Dias decorridos: no período corrente conta até hoje; nos passados, o
     período todo; nos futuros, zero — dividir por dias que ainda não
     aconteceram mentiria na média. */
  const bissexto = (ano % 4 === 0 && ano % 100 !== 0) || ano % 400 === 0;
  const total = mes === null ? (bissexto ? 366 : 365) : diasNoMes(ano, mes);
  const inicio = mes === null ? new Date(ano, 0, 1) : new Date(ano, mes, 1);
  const inicioAtual = mes === null
    ? new Date(HOJE.getFullYear(), 0, 1)
    : new Date(HOJE.getFullYear(), HOJE.getMonth(), 1);

  let decorridos;
  if (inicio.getTime() === inicioAtual.getTime()){
    decorridos = mes === null
      ? Math.round((HOJE - new Date(ano, 0, 1)) / 86400000) + 1
      : HOJE.getDate();
  } else if (inicio < inicioAtual) {
    decorridos = total;
  } else {
    decorridos = 0;
  }

  t.custoDeVida    = t.expense + t.recurring + t.card;
  t.performance    = t.income - t.custoDeVida - t.savings;
  t.decorridos     = decorridos;
  t.diasComDiario  = diasVistos.size;
  t.diarioMedio    = decorridos > 0 ? t.recurring / decorridos : 0;
  t.economizadoPct = t.income > 0 ? Math.max(0, Math.min(100, (t.savings / t.income) * 100)) : 0;
  return t;
}

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function chip(key){
  const mt = metricInfo(key);
  return `<span class="tt-chip c-${key}"><span class="metric-icon ${mt.icon}"></span></span>`;
}
function formula(keys, op){
  return keys.map(k => chip(k)).join(`<span class="tt-op">${esc(op)}</span>`);
}
function zeroCls(v){ return v === 0 ? ' is-zero' : ''; }

function linha({ formulaHTML, label, valor, valorCls = '', status, calc }){
  const multi = (formulaHTML.match(/tt-chip/g) || []).length >= 3 ? ' is-multi' : '';
  /* Com destino, a linha inteira vira o alvo do toque — área maior que um
     chevron, e o cursor avisa que dá para abrir. */
  const abre = calc ? ` role="link" tabindex="0" data-calc="${calc}" style="cursor:pointer"` : '';
  return `
    <div class="tt-row"${abre}>
      <div class="tt-left${multi}">
        <div class="tt-formula">${formulaHTML}</div>
        <span class="tt-label">${esc(label)}</span>
      </div>
      <div class="tt-right">
        <span class="tt-value${valorCls}${zeroCls(valor)}">${fmt(valor)}</span>
        ${status ? `<span class="tt-status">${esc(status)}</span>` : ''}
      </div>
    </div>`;
}

/* Mês a mês do ano, no formato da planilha: entradas, economia e a razão
   entre as duas. O rodapé soma o ano — e a % do ano é a razão dos totais,
   não a média das mensais, que daria outro número. */
function tabelaDoAno(){
  const linhas = [];
  let totEntradas = 0, totEconomia = 0;
  for (let m = 0; m < 12; m++){
    const t = totaisDoPeriodo(S.ano, m);
    totEntradas += t.income;
    totEconomia += t.savings;
    linhas.push({ m, entradas: t.income, economia: t.savings,
                  pct: t.income > 0 ? (t.savings / t.income) * 100 : null });
  }
  const pctAno = totEntradas > 0 ? (totEconomia / totEntradas) * 100 : null;
  const ehAtual = m => S.ano === HOJE.getFullYear() && m === HOJE.getMonth();
  const cls = v => v === 0 ? ' class="is-zero"' : '';

  return `
    <section class="tt-section">
      <h2 class="tt-section-title">mês a mês</h2>
      <div style="overflow-x:auto">
        <table class="ano-tabela">
          <thead><tr><th>mês</th><th>entradas</th><th>economia</th><th class="ano-pct">%</th></tr></thead>
          <tbody>
            ${linhas.map(l => `
              <tr class="${ehAtual(l.m) ? 'is-atual' : ''}">
                <td class="ano-mes">${MESES[l.m]}</td>
                <td${cls(l.entradas)}>${fmt(l.entradas)}</td>
                <td${cls(l.economia)}>${fmt(l.economia)}</td>
                <td class="ano-pct${l.pct === null ? ' is-zero' : ''}">${l.pct === null ? '—' : Math.round(l.pct) + '%'}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td class="ano-mes">${S.ano}</td>
              <td>${fmt(totEntradas)}</td>
              <td>${fmt(totEconomia)}</td>
              <td class="ano-pct">${pctAno === null ? '—' : Math.round(pctAno) + '%'}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>`;
}

function render(){
  const anual = S.escopo === 'ano';
  const t = totaisDoPeriodo(S.ano, anual ? null : S.mes);

  const perfCls    = t.performance < 0 ? ' is-neg' : (t.performance > 0 ? ' is-pos' : '');
  const perfStatus = t.performance < 0 ? 'faltou dinheiro'
                   : t.performance > 0 ? 'sobrou dinheiro'
                   : 'fechou no zero';
  const custoStatus = t.income === 0 ? (t.custoDeVida > 0 ? `sem renda no ${anual ? 'ano' : 'mês'}` : 'sem gastos')
                    : t.custoDeVida > t.income ? 'acima da renda' : 'dentro da renda';
  const pct = Math.round(t.economizadoPct);
  const ecoStatus = t.savings === 0 ? 'nada guardado' : `${pct}% da renda guardada`;

  document.getElementById('totaisCol').innerHTML = `
    <section class="tt-section">
      <h2 class="tt-section-title">cálculos do ${anual ? 'ano' : 'mês'}</h2>

      ${linha({
        formulaHTML: chip('income') + '<span class="tt-op">−</span>' +
                     formula(['expense','recurring','card','savings'], '−'),
        label: 'performance', calc: 'performance', valor: t.performance, valorCls: perfCls, status: perfStatus })}

      <div class="tt-row tt-row--stack" role="link" tabindex="0" data-calc="economizado" style="cursor:pointer">
        <div class="tt-stack-top">
          <div class="tt-left">
            <div class="tt-formula">${chip('savings')}</div>
            <span class="tt-label">economizado</span>
          </div>
          <div class="tt-right">
            <span class="tt-value${t.savings === 0 ? ' is-zero' : ''}">${pct}%</span>
          </div>
        </div>
        <div class="tt-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="${pct}" aria-label="Percentual da renda economizado">
          <div class="tt-meter-fill" id="ecoFill" style="width:${t.economizadoPct}%"></div>
        </div>
        <div class="tt-stack-bottom">
          <span class="tt-status">${esc(ecoStatus)}</span>
          <span class="tt-status">${fmt(t.savings)}</span>
        </div>
      </div>

      ${linha({
        formulaHTML: formula(['expense','recurring','card'], '+'),
        label: 'custo de vida', calc: 'custo-de-vida', valor: t.custoDeVida, status: custoStatus })}

      ${linha({
        formulaHTML: chip('recurring') + `<span class="tt-divisor">/${t.decorridos}</span>`,
        label: 'diário médio', calc: 'diario-medio', valor: t.diarioMedio,
        status: t.decorridos ? `${t.diasComDiario} de ${t.decorridos} dias`
                             : (anual ? 'ano ainda não começou' : 'mês ainda não começou') })}
    </section>

    ${anual ? tabelaDoAno() : ''}

    <section class="tt-section">
      <h2 class="tt-section-title">movimentações do ${anual ? 'ano' : 'mês'}</h2>
      ${linha({ formulaHTML: chip('income'),    label: 'entradas', valor: t.income,  valorCls: t.income  ? ' is-pos' : '' })}
      ${linha({ formulaHTML: chip('expense'),   label: 'saídas',   valor: t.expense })}
      ${linha({ formulaHTML: chip('recurring'), label: 'diários',  valor: t.recurring })}
      ${linha({ formulaHTML: chip('savings'),   label: 'economias',valor: t.savings })}
      ${linha({ formulaHTML: chip('card'),      label: 'cartão',   valor: t.card })}
    </section>`;

  /* A largura vai no próprio markup: depender de requestAnimationFrame deixava
     a barra em zero se o quadro não fosse agendado — barra vazia mentindo
     sobre quanto já foi gasto. */

  paintHorizon(buildYear(HOJE.getFullYear()));

  const rotulo = anual ? String(S.ano) : `${MESES[S.mes]}/${S.ano}`;
  document.getElementById('rangeLabel').textContent       = rotulo;
  document.getElementById('mobileMonthLabel').textContent = anual ? String(S.ano) : `${MESES_CAP[S.mes]}/${S.ano}`;
  /* No ano inteiro não há mês para avançar. */
  document.querySelectorAll('[data-nav="month-prev"],[data-nav="month-next"]')
    .forEach(b => { b.disabled = anual; b.style.opacity = anual ? '.35' : ''; });
  document.getElementById('sidebarTodayNum').textContent = HOJE.getDate();
  document.getElementById('mobileTodayNum').textContent  = HOJE.getDate();
  document.title = `totais · ${rotulo}`;
}

/* ══════════════════════════════════════════════════════════════
   NAVEGAÇÃO / EVENTOS
   ══════════════════════════════════════════════════════════════ */
function irPara(mes, ano){
  S.ano = ano;
  S.mes = ((mes % 12) + 12) % 12;
  render();
}

function abrirDetalhe(calc){ location.href = 'detalhe.html?calc=' + encodeURIComponent(calc); }

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const alvo = e.target.closest('[data-calc]');
  if (!alvo) return;
  e.preventDefault();
  abrirDetalhe(alvo.dataset.calc);
});

document.addEventListener('click', e => {
  const det = e.target.closest('[data-calc]');
  if (det && !e.target.closest('[data-nav],[data-action]')){ abrirDetalhe(det.dataset.calc); return; }

  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    const dir = navBtn.dataset.nav;
    if (dir === 'month-prev') irPara(S.mes - 1, S.mes === 0  ? S.ano - 1 : S.ano);
    if (dir === 'month-next') irPara(S.mes + 1, S.mes === 11 ? S.ano + 1 : S.ano);
    if (dir === 'year-prev')  irPara(S.mes, S.ano - 1);
    if (dir === 'year-next')  irPara(S.mes, S.ano + 1);
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act){
    if (act.dataset.action === 'escopo'){
      S.escopo = S.escopo === 'ano' ? 'mes' : 'ano';
      ls.set('brian-totais-escopo', S.escopo);
      render();
    }
    if (act.dataset.action === 'today'){
      S.escopo = 'mes';
      ls.set('brian-totais-escopo', 'mes');
      irPara(HOJE.getMonth(), HOJE.getFullYear());
    }
    if (act.dataset.action === 'horizon') location.href = 'horizonte.html';
    /* O lançamento vive na tela de saldos; mandar para o app antigo tirava
       o usuário do sistema novo no meio da tarefa. */
    if (act.dataset.action === 'add')     location.href = 'saldos.html#novo';
    return;
  }

  const collapseBtn = e.target.closest('#collapseBtn');
  if (collapseBtn){
    document.getElementById('sidebar').classList.toggle('is-collapsed');
    return;
  }
});


async function boot(){
  let semSessao = false;
  let autenticado = false;
  try {
    const sb = window.supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      autenticado = true;
      const { data, error } = await sb.from('movimentos').select('*').order('data', { ascending: true });
      if (!error && data) S.movs = data.map(toMov);
    } else {
      semSessao = true;
    }
  } catch (err) {
    console.warn('Supabase indisponível, usando dados de demonstração.', err);
  }
  /* Sem sessão vai pro login: mostrar números de demonstração para quem está
     deslogado engana. Só vale quando a página é servida pela web de verdade —
     aberta como arquivo (file:/data:) segue com a demonstração, senão não dá
     pra conferir o layout fora do servidor. */
  const naWeb = location.protocol === 'http:' || location.protocol === 'https:';
  if (semSessao && naWeb){
    location.replace('entrar.html');
    return;
  }
  /* Base vazia de usuário logado é base vazia — a demonstração só entra quando
     não há sessão nenhuma (arquivo aberto direto, para conferir layout).
     Inventar número para quem está autenticado é mentir sobre dinheiro. */
  if (!autenticado && !S.movs.length) S.movs = DEMO.map(toMov);
  render();
}

boot();
