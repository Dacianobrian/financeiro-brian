<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brian · Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --or:#E8521A; --or-l:#FFF1EB;
  --gr:#22C55E; --gr-l:#DCFCE7;
  --rd:#EF4444; --rd-l:#FEE2E2;
  --pu:#8B5CF6; --pu-l:#EDE9FE;
  --bl:#3B82F6; --bl-l:#DBEAFE;
  --am:#F59E0B; --am-l:#FEF3C7;
  --bg:#F4F4F5; --card:#FFFFFF;
  --t1:#111827; --t2:#4B5563; --t3:#9CA3AF;
  --br:#E5E7EB; --br2:#D1D5DB;
  --bnav:64px; --hdr:52px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);overflow:hidden}

/* ── LOGIN ─────────────────────────────── */
#login{position:fixed;inset:0;background:var(--or);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.l-logo{font-size:44px;margin-bottom:6px}
.l-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:32px;letter-spacing:-.3px}
.l-card{background:#fff;border-radius:22px;padding:28px 24px;width:100%;max-width:360px}
.l-card h2{font-size:20px;font-weight:700;margin-bottom:24px;color:var(--t1)}
.l-field{margin-bottom:18px}
.l-field label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.l-field input{width:100%;border:none;border-bottom:2px solid var(--br);padding:8px 0;font-size:17px;font-family:'DM Sans',sans-serif;outline:none;background:transparent;color:var(--t1)}
.l-field input:focus{border-bottom-color:var(--or)}
.l-err{color:var(--rd);font-size:13px;margin-top:4px;min-height:18px}
.btn-blk{display:block;width:100%;padding:14px;background:#111827;color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:20px;transition:opacity .15s}
.btn-blk:active{opacity:.8}

/* ── APP SHELL ──────────────────────────── */
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* Header */
#hdr{height:var(--hdr);padding-top:var(--st);background:var(--card);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px;flex-shrink:0;z-index:20}
.hdr-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);border:none;font-size:18px;cursor:pointer;color:var(--t1);font-family:'DM Sans',sans-serif}
.hdr-btn:active{background:var(--br)}
#hdr-title{font-size:16px;font-weight:700;letter-spacing:-.2px}

/* Pages */
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--bnav) + var(--sb) + 8px)}
.page.off{display:none}

/* Bottom Nav */
#bnav{height:calc(var(--bnav) + var(--sb));background:var(--card);border-top:1px solid var(--br);display:flex;align-items:flex-start;padding-top:8px;flex-shrink:0;z-index:20}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;padding:0}
.bn-ic{font-size:22px;line-height:1;height:24px;display:flex;align-items:center;justify-content:center}
.bn-lb{font-size:10px;color:var(--t3);font-weight:500;transition:color .12s}
.bn.on .bn-lb{color:var(--or)}
.bn-plus-wrap{width:44px;height:44px;background:var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-top:-4px;box-shadow:0 4px 14px rgba(232,82,26,.4);line-height:1}

/* ── SALDOS PAGE ────────────────────────── */
.saldo-filters{display:flex;gap:8px;padding:12px 16px 10px;overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--br);flex-shrink:0;position:sticky;top:0;z-index:5}
.saldo-filters::-webkit-scrollbar{display:none}
.fchip{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid var(--br);background:none;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;color:var(--t2);transition:.1s}
.fchip.on{background:var(--or);color:#fff;border-color:var(--or)}

.day-grp{padding:0 16px}
.day-hdr{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;border-bottom:1px solid var(--br)}
.day-lbl{font-size:13px;font-weight:700;color:var(--t2)}
.day-sal{font-size:13px;font-weight:700}
.day-sal.p{color:var(--gr)}
.day-sal.n{color:var(--rd)}

.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--br);cursor:pointer;transition:background .1s}
.tx:last-child{border-bottom:none}
.tx-ic{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.tx-ic.entrada{background:var(--gr-l)}
.tx-ic.saida{background:var(--rd-l)}
.tx-ic.cartao{background:var(--bl-l)}
.tx-ic.economia{background:var(--pu-l)}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-cat{font-size:12px;color:var(--t3);margin-top:1px}
.tx-val{font-size:15px;font-weight:700;flex-shrink:0}
.tx-val.entrada{color:var(--gr)}
.tx-val.saida{color:var(--rd)}
.tx-val.cartao{color:var(--bl)}
.tx-val.economia{color:var(--pu)}

/* ── TOTAIS PAGE ────────────────────────── */
.tot-hdr{padding:18px 16px 4px}
.tot-hdr h2{font-size:18px;font-weight:700;color:var(--t1)}

.mcard{background:var(--card);margin:8px 16px 0;border-radius:16px;border:1px solid var(--br);overflow:hidden}
.mcard-in{padding:16px}
.mc-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--t3);text-transform:uppercase}
.mc-val{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.mc-sub{font-size:12px;color:var(--t3);margin-top:2px}
.mc-val.g{color:var(--gr)} .mc-val.r{color:var(--rd)} .mc-val.o{color:var(--or)}
.dots{display:flex;gap:5px;margin-top:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--br)}
.dot.g{background:var(--gr)} .dot.y{background:var(--am)} .dot.r{background:var(--rd)}
.pbar-wrap{margin-top:10px;background:var(--br);border-radius:999px;height:7px;overflow:hidden}
.pbar{height:100%;border-radius:999px;transition:width .5s}
.mcard-rows{border-top:1px solid var(--br)}
.mcard-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--br)}
.mcard-row:last-child{border-bottom:none}
.mcard-row span:first-child{font-size:14px;color:var(--t2)}
.mcard-row span:last-child{font-size:14px;font-weight:700}

/* ── ADD MODAL ──────────────────────────── */
#add-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#add-modal.off{display:none}
.add-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding-bottom:calc(var(--sb) + 12px)}
.add-handle{width:36px;height:4px;background:var(--br2);border-radius:2px;margin:12px auto 0}
.add-types{display:flex;border-bottom:1px solid var(--br);margin-top:10px}
.atype{flex:1;padding:11px 0;text-align:center;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;border:none;background:none;cursor:pointer;color:var(--t3);border-bottom:2.5px solid transparent;transition:.12s}
.atype.on{color:var(--or);border-bottom-color:var(--or)}
.add-body{padding:18px 20px 4px}
.add-amt-wrap{text-align:center;padding:4px 0 18px}
.add-amt-lbl{font-size:12px;color:var(--t3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
#add-amt{font-size:40px;font-weight:700;border:none;outline:none;text-align:center;width:100%;background:transparent;font-family:'DM Sans',sans-serif;color:var(--t1)}
.afield{margin-bottom:14px}
.afield label{font-size:12px;color:var(--t2);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.afield input,.afield select{width:100%;border:1.5px solid var(--br);border-radius:12px;padding:11px 13px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;background:var(--bg);color:var(--t1);appearance:none}
.afield input:focus,.afield select:focus{border-color:var(--or)}
.add-save{display:block;width:100%;padding:14px;background:var(--or);color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:10px;transition:opacity .15s}
.add-save:active{opacity:.8}
.add-save:disabled{opacity:.5}

/* ── TX DETAIL MODAL ────────────────────── */
#tx-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#tx-modal.off{display:none}
.tx-sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:20px 20px calc(var(--sb) + 20px)}
.tx-sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.tx-sheet-hdr h3{font-size:18px;font-weight:700}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tx-detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--br)}
.tx-detail-row:last-child{border-bottom:none}
.tx-detail-lbl{font-size:14px;color:var(--t2)}
.tx-detail-val{font-size:14px;font-weight:600}
.btn-del{display:block;width:100%;padding:13px;background:var(--rd-l);color:var(--rd);border:none;border-radius:999px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:20px;transition:opacity .15s}
.btn-del:active{opacity:.7}

/* ── MENU PAGE ──────────────────────────── */
.menu-hdr{padding:24px 16px 12px}
.menu-hdr h2{font-size:22px;font-weight:700}
.msec{padding:0 16px 12px}
.msec-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.mcard2{background:var(--card);border-radius:16px;border:1px solid var(--br);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--br)}
.mrow:last-child{border-bottom:none}
.mrow-ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mrow-body{flex:1}
.mrow-title{font-size:15px;font-weight:600}
.mrow-sub{font-size:13px;color:var(--t3);margin-top:1px}
.btn-out{display:block;width:calc(100% - 32px);margin:8px 16px 20px;padding:13px;border:1.5px solid var(--br);background:none;border-radius:999px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--t2)}

/* ── CONTAS PAGE ────────────────────────── */
.cv-hdr{padding:20px 16px 8px}
.cv-hdr h2{font-size:22px;font-weight:700}
.cv-sec{padding:0 16px 12px}
.cv-sec-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cv-card{background:var(--card);border-radius:16px;border:1px solid var(--br);overflow:hidden}
.cv-item{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--br)}
.cv-item:last-child{border-bottom:none}
.cv-day{min-width:42px;height:42px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.cv-day-n{font-size:16px;font-weight:700;line-height:1}
.cv-day-s{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);line-height:1;margin-top:1px}
.cv-day.at{background:var(--rd-l)} .cv-day.at .cv-day-n{color:var(--rd)} .cv-day.at .cv-day-s{color:var(--rd)}
.cv-day.hj{background:var(--or-l)} .cv-day.hj .cv-day-n{color:var(--or)} .cv-day.hj .cv-day-s{color:var(--or)}
.cv-day.ok{background:var(--gr-l)} .cv-day.ok .cv-day-n{color:var(--gr)} .cv-day.ok .cv-day-s{color:var(--gr)}
.cv-body{flex:1;min-width:0}
.cv-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-sub{font-size:12px;color:var(--t3);margin-top:1px}
.cv-amt{font-size:15px;font-weight:700;flex-shrink:0}
.cv-comprom{background:var(--card);margin:0 16px 12px;border-radius:16px;border:1px solid var(--br);padding:16px}
.cv-comprom-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.cv-comprom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.cv-comprom-item{background:var(--bg);border-radius:12px;padding:10px}
.cv-comprom-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-bottom:2px}
.cv-comprom-val{font-size:14px;font-weight:700;color:var(--t1)}
.cv-comprom-total{border-top:1px solid var(--br);padding-top:12px;display:flex;justify-content:space-between;align-items:center}
.cv-comprom-total-lbl{font-size:13px;color:var(--t2);font-weight:500}
.cv-comprom-total-val{font-size:18px;font-weight:700;color:var(--rd)}

/* ── UTILITIES ─────────────────────────── */
.empty{padding:56px 16px;text-align:center;color:var(--t3);font-size:14px;line-height:1.6}
.loading{padding:56px 16px;text-align:center;color:var(--t3);font-size:14px}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="l-logo">🏠</div>
  <div class="l-title">Finanças do Brian</div>
  <div class="l-card">
    <h2>entrar</h2>
    <div class="l-field">
      <label>senha</label>
      <input type="password" id="pwd" placeholder="" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="l-err" id="lerr"></div>
    <button class="btn-blk" onclick="doLogin()">entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="hdr">
    <button class="hdr-btn" onclick="prevM()">‹</button>
    <span id="hdr-title"></span>
    <button class="hdr-btn" onclick="nextM()">›</button>
  </div>

  <div id="pages">
    <!-- Saldos -->
    <div id="pg-saldos" class="page">
      <div class="saldo-filters" id="filters">
        <button class="fchip on" onclick="setFilter('all',this)">Todas</button>
        <button class="fchip" onclick="setFilter('income',this)">Entradas</button>
        <button class="fchip" onclick="setFilter('expense',this)">Saídas</button>
        <button class="fchip" onclick="setFilter('card',this)">Cartão</button>
        <button class="fchip" onclick="setFilter('savings',this)">Economia</button>
      </div>
      <div id="saldos-list"></div>
    </div>

    <!-- Totais -->
    <div id="pg-totais" class="page off">
      <div id="totais-content"></div>
    </div>

    <!-- Contas -->
    <div id="pg-contas" class="page off">
      <div id="contas-content"></div>
    </div>

    <!-- Menu -->
    <div id="pg-menu" class="page off">
      <div class="menu-hdr"><h2>Menu</h2></div>
      <div id="menu-content"></div>
    </div>
  </div>

  <nav id="bnav">
    <button class="bn on" id="bn-saldos" onclick="goTo('saldos')">
      <span class="bn-ic">💰</span><span class="bn-lb">Saldos</span>
    </button>
    <button class="bn" id="bn-totais" onclick="goTo('totais')">
      <span class="bn-ic">📊</span><span class="bn-lb">Totais</span>
    </button>
    <button class="bn" onclick="openAdd()">
      <span class="bn-ic"><span class="bn-plus-wrap">+</span></span>
      <span class="bn-lb">&nbsp;</span>
    </button>
    <button class="bn" id="bn-contas" onclick="goTo('contas')">
      <span class="bn-ic">📌</span><span class="bn-lb">Contas</span>
    </button>
    <button class="bn" id="bn-menu" onclick="goTo('menu')">
      <span class="bn-ic">☰</span><span class="bn-lb">Menu</span>
    </button>
  </nav>
</div>

<!-- ADD MODAL -->
<div id="add-modal" class="off">
  <div class="add-sheet" onclick="event.stopPropagation()">
    <div class="add-handle"></div>
    <div class="add-types">
      <button class="atype on" onclick="setAType('income',this)">Entrada</button>
      <button class="atype" onclick="setAType('expense',this)">Saída</button>
      <button class="atype" onclick="setAType('card',this)">Cartão</button>
      <button class="atype" onclick="setAType('savings',this)">Economia</button>
    </div>
    <div class="add-body">
      <div class="add-amt-wrap">
        <div class="add-amt-lbl">valor (R$)</div>
        <input id="add-amt" type="number" inputmode="decimal" placeholder="0,00" step="0.01">
      </div>
      <div class="afield">
        <label>Descrição</label>
        <input type="text" id="add-desc" placeholder="ex: Salário, Mercado...">
      </div>
      <div class="afield">
        <label>Data</label>
        <input type="date" id="add-date">
      </div>
      <div class="afield">
        <label>Categoria</label>
        <input type="text" id="add-cat" placeholder="ex: Alimentação, Saúde...">
      </div>
      <button class="add-save" id="add-btn" onclick="submitAdd()">Salvar</button>
    </div>
  </div>
</div>

<!-- TX DETAIL MODAL -->
<div id="tx-modal" class="off" onclick="closeTx()">
  <div class="tx-sheet" onclick="event.stopPropagation()">
    <div class="tx-sheet-hdr">
      <h3>Movimentação</h3>
      <button class="close-btn" onclick="closeTx()">×</button>
    </div>
    <div id="tx-detail-body"></div>
    <button class="btn-del" id="tx-del-btn">Excluir</button>
  </div>
</div>

const FILTRO = {income:['income','entrada'],expense:['expense','saida'],card:['card','cartao','transfer'],savings:['savings','economia','investment']};
const TAG_COLORS = ['#22C55E','#EF4444','#3B82F6','#8B5CF6','#F59E0B','#E8521A','#06B6D4','#EC4899','#84CC16','#14B8A6'];

// ── AUTH ───────────────────────────────────────────────────────
async function sha256(msg){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const pwd = document.getElementById('pwd').value;
  const hash = await sha256(pwd);
  if(hash === PWD_HASH){
    localStorage.setItem('auth','1');
    boot();
  } else {
    document.getElementById('lerr').textContent = 'Senha incorreta';
  }
}
function checkAuth(){
  if(localStorage.getItem('auth')==='1') boot();
}
function logout(){
  localStorage.removeItem('auth');
  location.reload();
}

// ── BOOT ───────────────────────────────────────────────────────
function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('app').style.flexDirection='column';
  updateHdr();
  loadData();
}

// ── SUPABASE ───────────────────────────────────────────────────
async function sb(table, params={}, opts={}){
  const url = new URL(`${SUPA_URL}/rest/v1/${table}`);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r = await fetch(url, {
    method: opts.method||'GET',
    headers:{
      'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer': opts.prefer||'return=representation',
      ...(opts.headers||{})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!r.ok){ console.error(r.status, await r.text()); return null; }
  if(r.status===204) return null;
  return r.json();
}

// ── HELPERS ────────────────────────────────────────────────────
function brl(n){
  return 'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function brlSign(n){
  return (n>=0?'+':'-')+' '+brl(n);
}
function pad2(n){return String(n).padStart(2,'0')}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function mStr(y,m){return MOS[m]+'/'+String(y).slice(2)}
function dStr(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`}
function dowOf(s){return DOW[new Date(s+'T12:00:00').getDay()]}
function todayStr(){return dStr(_now.getFullYear(),_now.getMonth(),_now.getDate())}

// ── NAVIGATION ─────────────────────────────────────────────────
function goTo(tab){
  _tab = tab;
  ['saldos','totais','contas','menu'].forEach(t=>{
    document.getElementById('pg-'+t).classList.toggle('off', t!==tab);
    const b = document.getElementById('bn-'+t);
    if(b) b.classList.toggle('on', t===tab);
  });
  if(tab==='totais') renderTotais();
  if(tab==='contas') renderContas();
  if(tab==='menu')   renderMenu();
}
function prevM(){
  if(_mo===0){_mo=11;_yr--;}else _mo--;
  updateHdr(); loadData();
}
function nextM(){
  if(_mo===11){_mo=0;_yr++;}else _mo++;
  updateHdr(); loadData();
}
function updateHdr(){document.getElementById('hdr-title').textContent=mStr(_yr,_mo);}

// ── LOAD DATA ──────────────────────────────────────────────────
async function loadData(){
  document.getElementById('saldos-list').innerHTML='<div class="loading"><span class="spin">⟳</span> Carregando...</div>';
  const from = dStr(_yr,_mo,1);
  const to   = dStr(_yr,_mo,dim(_yr,_mo));

  const [txData,accData,fcData,subData,instData] = await Promise.all([
    sb('transactions',{
      select:'id,date,description,amount,type,category',
      'date':'gte.'+from,
      order:'date.asc',
      limit:2000
    }),
    sb('accounts',{select:'id,name,bank,balance,type'}),
    sb('fixed_costs',{select:'id,description,amount,due_day,category,account',order:'due_day.asc'}),
    sb('subscriptions',{select:'id,name,amount,card,category,billing_day,emoji,active',order:'billing_day.asc'}),
    sb('installments',{select:'id,description,installment_amount,current_installment,total_installments,card,emoji,active',order:'card.asc'})
  ]);

  _txs      = (txData||[]).filter(t=>t.date>=from && t.date<=to);
  _accs     = accData||[];
  _fixedCosts = fcData||[];
  _subs     = (subData||[]).filter(s=>s.active!==false);
  _installs = (instData||[]).filter(i=>i.active!==false);

  renderSaldos();
  if(_tab==='totais') renderTotais();
  if(_tab==='contas') renderContas();
  if(_tab==='menu')   renderMenu();
}

function setFilter(f,el){

  el.classList.add('on');

}

// ── SALDOS ─────────────────────────────────────────────────────
function renderSaldos(){
  const el = document.getElementById('saldos-list');
  if(!el) return;

  const totalBal = _accs.reduce((s,a)=>s+parseFloat(a.balance||0),0);
  const isIncome = t=>t.type==='income'||t.type==='entrada';
  const monthNet = _txs.reduce((s,t)=>{
    const a=parseFloat(t.amount||0);
    return isIncome(t)?s+a:s-a;
  },0);

  // Group by date (all txs for saldo calculation)
  const byDate={};
  _txs.forEach(t=>{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);});
  const dates=Object.keys(byDate).sort();

  if(dates.length===0){
    el.innerHTML='<div class="empty">Nenhuma movimentação<br>neste mês</div>';
    return;
  }

  let runSaldo = totalBal - monthNet;
  const today  = todayStr();
  let html='';

  for(const date of dates){
    const dayAll = byDate[date];
    const dayNet = dayAll.reduce((s,t)=>{
      const a=parseFloat(t.amount||0);
      return isIncome(t)?s+a:s-a;
    },0);
    runSaldo += dayNet;

    const display = _filter==='all' ? dayAll : dayAll.filter(t=>(FILTRO[_filter]||[_filter]).includes(t.type));
    if(!display.length) continue;

    const d   = parseInt(date.slice(8));
    const dow = dowOf(date);
    const isTd = date===today;
    const pos  = runSaldo>=0;

    html+=`<div class="day-grp">
  <div class="day-hdr">
    <span class="day-lbl">${d} ${dow}${isTd?' · hoje':''}</span>
    <span class="day-sal ${pos?'p':'n'}">${brl(runSaldo)}</span>
  </div>`;

    for(const t of display){
      const cls = TIPO_CLS[t.type]||'saida';
      const ic  = TIPO_IC[t.type]||'⚪';
      const amt = parseFloat(t.amount||0);
      const sign= t.type==='income'?'+':'-';
      html+=`<div class="tx" onclick="openTx('${t.id}')">
    <div class="tx-ic ${cls}">${ic}</div>
    <div class="tx-body">
      <div class="tx-desc">${esc(t.description||'Sem descrição')}</div>
      <div class="tx-cat">${esc(t.category||TIPO_LBL[t.type]||'')}</div>
    </div>
    <div class="tx-val ${cls}">${sign} ${brl(amt)}</div>
  </div>`;
    }
    html+='</div>';
  }

  el.innerHTML=html;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── TX DETAIL ──────────────────────────────────────────────────
function openTx(id){
  const t=_txs.find(x=>x.id===id);
  if(!t) return;
  _curTx=t;
  const cls=TIPO_CLS[t.type]||'saida';
  const amt=parseFloat(t.amount||0);
  const sign=t.type==='income'?'+':'-';
  const d=new Date(t.date+'T12:00:00');
  const dateLabel=`${d.getDate()} de ${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()]} de ${d.getFullYear()}`;

  document.getElementById('tx-detail-body').innerHTML=`
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Tipo</span>
      <span class="tx-detail-val tx-val ${cls}">${TIPO_LBL[t.type]||t.type}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Valor</span>
      <span class="tx-detail-val tx-val ${cls}">${sign} ${brl(amt)}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Descrição</span>
      <span class="tx-detail-val">${esc(t.description||'—')}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Categoria</span>
      <span class="tx-detail-val">${esc(t.category||'—')}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Data</span>
      <span class="tx-detail-val">${dateLabel}</span>
    </div>`;

  document.getElementById('tx-del-btn').onclick=()=>deleteTx(id);
  document.getElementById('tx-modal').classList.remove('off');
}
function closeTx(){ document.getElementById('tx-modal').classList.add('off'); }
async function deleteTx(id){
  if(!confirm('Excluir esta movimentação?')) return;
  await sb('transactions',{id:'eq.'+id},{method:'DELETE',prefer:'return=minimal'});
  closeTx();
  loadData();
}

// ── TOTAIS ─────────────────────────────────────────────────────
function renderTotais(){
  const el=document.getElementById('totais-content');
  if(!el) return;

  const totalBal=_accs.reduce((s,a)=>s+parseFloat(a.balance||0),0);
  let entradas=0,saidas=0,cartao=0,economia=0;
  _txs.forEach(t=>{
    const a=parseFloat(t.amount||0);
    const tp=t.type;
    if(tp==='income'||tp==='entrada') entradas+=a;
    else if(tp==='expense'||tp==='saida') saidas+=a;
    else if(tp==='card'||tp==='cartao'||tp==='transfer') cartao+=a;
    else if(tp==='savings'||tp==='economia'||tp==='investment') economia+=a;
  });

  const custoVida=saidas+cartao;
  const sobrou=entradas-custoVida-economia;
  const pctEcon=entradas>0?(economia/entradas*100):0;
  const pctCusto=entradas>0?(custoVida/entradas*100):100;
  const hoje=new Date();
  const diasP=(_yr===hoje.getFullYear()&&_mo===hoje.getMonth())?hoje.getDate():dim(_yr,_mo);
  const diarioMed=diasP>0?custoVida/diasP:0;

  // Score 0–5
  let score=0;
  if(entradas>0) score++;
  if(sobrou>=0) score++;
  if(pctEcon>=10) score++;
  if(pctEcon>=20) score++;
  if(pctCusto<=70) score++;

  function dots(s){
    let h='<div class="dots">';
    for(let i=0;i<5;i++){
      const c=i<s?(s>=4?'g':s>=3?'y':'r'):'';
      h+=`<div class="dot ${c}"></div>`;
    }
    return h+'</div>';
  }

  const sPos=sobrou>=0;
  const eCls=pctEcon>=20?'g':pctEcon>=10?'o':'r';
  const ePBarColor=pctEcon>=10?'var(--gr)':pctEcon>0?'var(--or)':'var(--rd)';

  el.innerHTML=`
  <div class="tot-hdr"><h2>Totais · ${mStr(_yr,_mo)}</h2></div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Performance</div>
      <div class="mc-val ${sPos?'g':'r'}">${brl(Math.abs(sobrou))}</div>
      <div class="mc-sub">${sPos?'Sobrou no mês':'Faltou dinheiro'}</div>
      ${dots(score)}
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Economizado</div>
      <div class="mc-val ${eCls}">${pctEcon.toFixed(0)}%</div>
      <div class="mc-sub">${pctEcon>=20?'Excelente':pctEcon>=10?'Bom':pctEcon>0?'Atenção':'Nada guardado'}</div>
      <div class="pbar-wrap"><div class="pbar" style="width:${Math.min(pctEcon,100)}%;background:${ePBarColor}"></div></div>
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Custo de Vida</div>
      <div class="mc-val">${brl(custoVida)}</div>
      <div class="mc-sub">${entradas>0?pctCusto.toFixed(0)+'% da renda':'Sem receita no mês'}</div>
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Diário Médio</div>
      <div class="mc-val">${brl(diarioMed)}</div>
      <div class="mc-sub">Baseado em ${diasP} dias</div>
    </div>
  </div>

  <div class="mcard" style="margin-top:12px;margin-bottom:4px">
    <div class="mcard-in"><div class="mc-label">Resumo do Mês</div></div>
    <div class="mcard-rows">
      ${mrow('Entradas','+ '+brl(entradas),'color:var(--gr)')}
      ${mrow('Saídas','− '+brl(saidas),'color:var(--rd)')}
      ${mrow('Cartão','− '+brl(cartao),'color:var(--bl)')}
      ${mrow('Economia','+ '+brl(economia),'color:var(--pu)')}
      ${mrow('Saldo Atual',brl(totalBal),totalBal>=0?'color:var(--gr)':'color:var(--rd)')}
    </div>
  </div>
  ${renderComprometimento()}`;
}

function renderComprometimento(){
  const totalFixas=_fixedCosts.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalSubs=_subs.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalInst=_installs.reduce((s,c)=>s+parseFloat(c.installment_amount||0),0);
  const totalC=totalFixas+totalSubs+totalInst;
  if(!totalC) return '';
  return `
  <div class="mcard" style="margin-top:8px;margin-bottom:4px">
    <div class="mcard-in"><div class="mc-label">Comprometimento Mensal</div></div>
    <div class="mcard-rows">
      ${mrow('Contas Fixas',brl(totalFixas),'color:var(--rd)')}
      ${mrow('Assinaturas',brl(totalSubs),'color:var(--rd)')}
      ${mrow('Parcelamentos',brl(totalInst),'color:var(--rd)')}
      ${mrow('Total comprometido',brl(totalC),'color:var(--rd);font-weight:800')}
    </div>
  </div>`;
}

function mrow(l,v,style=''){
  return `<div class="mcard-row"><span>${l}</span><span style="${style}">${v}</span></div>`;
}

// ── TAGS ───────────────────────────────────────────────────────
function renderContas(){
  const el=document.getElementById('contas-content');
  if(!el) return;

  const today=new Date();
  const todayDay=(_yr===today.getFullYear()&&_mo===today.getMonth())?today.getDate():32;

  // Helper: check if a fixed cost amount was already paid this month
  function isPago(amount){
    return _txs.some(t=>{
      const tp=t.type;
      const paid=(tp==='saida'||tp==='expense'||tp==='cartao'||tp==='card');
      return paid && Math.abs(parseFloat(t.amount)-amount)<0.05;
    });
  }

  function dayBadge(day, pago){
    if(pago) return `<div class="cv-day ok"><div class="cv-day-n">${day}</div><div class="cv-day-s">PAGO</div></div>`;
    if(day<todayDay) return `<div class="cv-day at"><div class="cv-day-n">${day}</div><div class="cv-day-s">ATRASO</div></div>`;
    if(day===todayDay) return `<div class="cv-day hj"><div class="cv-day-n">${day}</div><div class="cv-day-s">HOJE</div></div>`;
    return `<div class="cv-day"><div class="cv-day-n">${day}</div><div class="cv-day-s">DIA</div></div>`;
  }

  // Fixed costs grouped: atrasadas, hoje, próximas, pagas
  const fcHtml=_fixedCosts.map(c=>{
    const day=c.due_day||1;
    const pago=isPago(parseFloat(c.amount));
    return `<div class="cv-item">
      ${dayBadge(day,pago)}
      <div class="cv-body">
        <div class="cv-name">${esc(c.description)}</div>
        <div class="cv-sub">${esc(c.category||'')}</div>
      </div>
      <div class="cv-amt" style="color:${pago?'var(--gr)':'var(--rd)'}">${brl(parseFloat(c.amount))}</div>
    </div>`;
  }).join('');

  // Subscriptions
  const subHtml=_subs.map(s=>{
    const day=s.billing_day||1;
    return `<div class="cv-item">
      ${dayBadge(day,false)}
      <div class="cv-body">
        <div class="cv-name">${esc(s.emoji||'📱')} ${esc(s.name)}</div>
        <div class="cv-sub">${esc(s.card||'')}</div>
      </div>
      <div class="cv-amt" style="color:var(--rd)">${brl(parseFloat(s.amount))}</div>
    </div>`;
  }).join('');

  // Installments grouped by card
  const byCard={};
  _installs.forEach(i=>{
    const card=i.card||'Cartão';
    if(!byCard[card]) byCard[card]={total:0,items:[]};
    byCard[card].items.push(i);
    byCard[card].total+=parseFloat(i.installment_amount);
  });

  const instHtml=Object.entries(byCard).map(([card,g])=>{
    const rows=g.items.map(i=>`<div class="cv-item">
      <div class="cv-day"><div class="cv-day-n">${i.current_installment}</div><div class="cv-day-s">/${i.total_installments}</div></div>
      <div class="cv-body">
        <div class="cv-name">${esc(i.emoji||'🛒')} ${esc(i.description)}</div>
        <div class="cv-sub">${i.current_installment}/${i.total_installments} parcelas</div>
      </div>
      <div class="cv-amt" style="color:var(--bl)">${brl(parseFloat(i.installment_amount))}/mês</div>
    </div>`).join('');
    return `<div class="cv-sec">
      <div class="cv-sec-title"><span>${esc(card)}</span><span style="color:var(--rd)">${brl(g.total)}/mês</span></div>
      <div class="cv-card">${rows}</div>
    </div>`;
  }).join('');

  const totalFixas=_fixedCosts.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalSubs=_subs.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalInst=_installs.reduce((s,c)=>s+parseFloat(c.installment_amount||0),0);

  el.innerHTML=`
  <div class="cv-hdr"><h2>Contas</h2></div>
  <div class="cv-comprom">
    <div class="cv-comprom-title">Comprometimento Mensal</div>
    <div class="cv-comprom-grid">
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Fixas</div><div class="cv-comprom-val">${brl(totalFixas)}</div></div>
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Assinaturas</div><div class="cv-comprom-val">${brl(totalSubs)}</div></div>
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Parcelamentos</div><div class="cv-comprom-val">${brl(totalInst)}</div></div>
    </div>
    <div class="cv-comprom-total">
      <span class="cv-comprom-total-lbl">Total comprometido</span>
      <span class="cv-comprom-total-val">${brl(totalFixas+totalSubs+totalInst)}</span>
    </div>
  </div>
  ${_fixedCosts.length?`<div class="cv-sec">
    <div class="cv-sec-title"><span>Contas Fixas</span><span style="color:var(--rd)">${brl(totalFixas)}/mês</span></div>
    <div class="cv-card">${fcHtml}</div>
  </div>`:''}
  ${_subs.length?`<div class="cv-sec">
    <div class="cv-sec-title"><span>Assinaturas</span><span style="color:var(--rd)">${brl(totalSubs)}/mês</span></div>
    <div class="cv-card">${subHtml}</div>
  </div>`:''}
  ${instHtml}`;
}

// ── ADD TRANSACTION ─────────────────────────────────────────────
function openAdd(){
  const today=dStr(_yr,_mo,Math.min(_now.getDate(),dim(_yr,_mo)));
  document.getElementById('add-date').value=today;
  document.getElementById('add-amt').value='';
  document.getElementById('add-desc').value='';
  document.getElementById('add-cat').value='';
  document.getElementById('add-modal').classList.remove('off');
  setTimeout(()=>document.getElementById('add-amt').focus(),200);
}
function closeAdd(){ document.getElementById('add-modal').classList.add('off'); }

document.getElementById('add-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('add-modal')) closeAdd();
});

function setAType(t,el){
  _atype=t;
  document.querySelectorAll('.atype').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

async function submitAdd(){
  const amt=parseFloat(document.getElementById('add-amt').value);
  const desc=document.getElementById('add-desc').value.trim();
  const date=document.getElementById('add-date').value;
  const cat=document.getElementById('add-cat').value.trim();
  if(!amt||!desc||!date){ alert('Preencha valor, descrição e data'); return; }
  const btn=document.getElementById('add-btn');
  btn.textContent='Salvando...'; btn.disabled=true;
  await sb('transactions',{},{
    method:'POST', prefer:'return=minimal',
    body:{ description:desc, amount:Math.abs(amt), type:_atype, date, category:cat||TIPO_LBL[_atype] }
  });
  btn.textContent='Salvar'; btn.disabled=false;
  closeAdd();
