<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brian · Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --or:#FF5917; --or-l:rgba(255,89,23,.14); --or-d:rgba(255,89,23,.07);
  --gr:#22C55E; --gr-l:rgba(34,197,94,.14);
  --rd:#EF4444; --rd-l:rgba(239,68,68,.14);
  --pu:#8B5CF6; --pu-l:rgba(139,92,246,.14);
  --bl:#3B82F6; --bl-l:rgba(59,130,246,.14);
  --am:#F59E0B; --am-l:rgba(245,158,11,.14);
  --bg:#0C0D10; --card:#131519; --card2:#191B1F;
  --t1:#E8E9EB; --t2:#5E6170; --t3:#2C2F38;
  --br:rgba(255,255,255,.06); --br2:rgba(255,255,255,.03);
  --shadow:0 1px 4px rgba(0,0,0,.5);
  --bnav:64px; --hdr:54px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);overflow:hidden}

/* ── LOGIN ─────────────────────────────── */
#login{position:fixed;inset:0;background:var(--or);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.l-logo{font-size:44px;margin-bottom:6px}
.l-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:32px;letter-spacing:-.3px}
.l-card{background:#181A21;border-radius:24px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.07)}
.l-card h2{font-size:19px;font-weight:700;margin-bottom:24px;color:#F0F1F3}
.l-field{margin-bottom:18px}
.l-field label{display:block;font-size:12px;font-weight:600;color:#91949A;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.l-field input{width:100%;border:none;border-bottom:2px solid rgba(255,255,255,.15);padding:8px 0;font-size:17px;font-family:'DM Sans',sans-serif;outline:none;background:transparent;color:#EDEDEE}
.l-field input:focus{border-bottom-color:var(--or)}
.l-err{color:#FF7B7B;font-size:13px;margin-top:4px;min-height:18px}
.btn-blk{display:block;width:100%;padding:14px;background:var(--or);color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:20px;transition:opacity .15s}
.btn-blk:active{opacity:.8}

/* ── APP SHELL ──────────────────────────── */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── SIDEBAR ─────────────────────────────── */
#sidebar{width:180px;background:var(--card);border-right:1px solid var(--br);display:none;flex-direction:column;flex-shrink:0;z-index:10;transition:width .2s ease;overflow:hidden}
#sidebar.col{width:52px}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--br);white-space:nowrap;overflow:hidden}
.sb-logo-ic{font-size:20px;flex-shrink:0;line-height:1}
.sb-logo-name{font-size:15px;font-weight:800;color:var(--or);letter-spacing:-.3px}
.sb-nav{flex:1;padding:10px 8px;overflow:hidden}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);border-radius:8px;margin-bottom:1px;transition:color .1s;border:none;background:none;font-family:'DM Sans',sans-serif;text-align:left;white-space:nowrap;overflow:hidden}
.sb-item:hover{color:var(--t1)}
.sb-item.on{color:var(--or);font-weight:600;background:none}
.sb-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0;line-height:1;opacity:.7}
.sb-item.on .sb-ic{opacity:1}
.sb-lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-bottom{padding:6px 8px 14px;border-top:1px solid var(--br);overflow:hidden}
.sb-add{display:flex;align-items:center;gap:9px;width:100%;padding:10px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--or);background:none;border-radius:8px;margin-bottom:1px;border:none;font-family:'DM Sans',sans-serif;text-align:left;white-space:nowrap;overflow:hidden;transition:color .1s}
.sb-add:hover{color:#fff}
.sb-add-ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-collapse{display:flex;align-items:center;justify-content:center;width:100%;padding:8px;cursor:pointer;font-size:12px;color:var(--t3);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .2s;border-radius:8px}
.sb-collapse:hover{color:var(--t2)}
#sidebar.col .sb-collapse{transform:rotate(180deg)}
#sidebar.col .sb-lb,#sidebar.col .sb-logo-name{display:none}

/* Header */
#hdr{height:var(--hdr);padding-top:var(--st);background:var(--card);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:14px;flex-shrink:0;z-index:20}
#hdr-page-title{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--t1);flex:1}
.hdr-nav{display:flex;align-items:center;gap:4px}
.hdr-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--card2);border:none;font-size:16px;cursor:pointer;color:var(--t2);font-family:'DM Sans',sans-serif;font-weight:700;transition:all .1s}
.hdr-btn:hover{color:var(--t1);background:var(--card2)}
.hdr-btn:active{color:var(--or)}
.hdr-btn-skip{opacity:.5}
#hdr-title{font-size:13px;font-weight:600;color:var(--t2);padding:0 6px;white-space:nowrap;letter-spacing:-.1px}

/* Pages */
#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--bnav) + var(--sb) + 8px)}
.page.off{display:none}

/* Bottom Nav */
#bnav{height:calc(var(--bnav) + var(--sb));background:var(--card);border-top:1px solid var(--br);display:flex;align-items:flex-start;padding-top:7px;flex-shrink:0;z-index:20;box-shadow:0 -4px 20px rgba(0,0,0,.35)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;padding:0}
.bn-ic{font-size:20px;line-height:1;height:32px;width:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;transition:background .15s}
.bn.on .bn-ic{background:var(--or-d)}
.bn-lb{font-size:10px;color:var(--t3);font-weight:600;transition:color .12s;letter-spacing:.02em}
.bn.on .bn-lb{color:var(--or)}
.bn-plus-wrap{width:48px;height:48px;background:var(--or);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-top:-8px;box-shadow:0 6px 20px rgba(255,89,23,.45);line-height:1}

/* ── RESPONSIVO ──────────────────────────── */
@media(min-width:640px){
  #app{flex-direction:row}
  #sidebar{display:flex}
  #bnav{display:none!important}
  .page{padding-bottom:8px!important}
}
@media(max-width:639px){
  .page{padding-bottom:calc(var(--bnav) + var(--sb) + 8px)!important}
}

/* ── SALDOS GRID (estilo Breno) ─────────── */
.sg-summary{padding:16px 16px 14px;background:var(--card);border-bottom:1px solid var(--br)}
.sg-bal{font-size:32px;font-weight:800;letter-spacing:-.8px;color:var(--t1)}
.sg-bal-lbl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;margin-bottom:12px}
.sg-month-sum{display:flex;gap:0;margin-top:0;flex-wrap:nowrap;background:var(--bg);border-radius:14px;overflow:hidden}
.sg-ms-item{display:flex;flex-direction:column;flex:1;padding:10px 12px;border-right:1px solid var(--br)}
.sg-ms-item:last-child{border-right:none}
.sg-ms-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.sg-ms-val{font-size:13px;font-weight:800;margin-top:3px}

.sg-table{border-collapse:collapse;width:100%;background:var(--card)}
.sg-thead tr{border-bottom:2px solid var(--br);background:var(--card)}
.sg-thead th{padding:10px 16px;font-size:11px;font-weight:700;color:var(--t3);text-align:right;text-transform:uppercase;letter-spacing:.04em}
.sg-thday{text-align:left!important;width:60px}
.sg-th-amt{text-align:center!important;width:auto}
.sg-th-sal{width:auto}
.sg-type-btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1.5px solid var(--br);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--t1);white-space:nowrap}
.sg-type-btn .arr{font-size:9px;color:var(--t3);margin-left:2px}

.sg-row{border-bottom:1px solid var(--br);cursor:pointer;transition:background .07s}
.sg-row:active{filter:brightness(.95)}
.sg-row td{padding:12px 16px;vertical-align:middle}
.sg-day{text-align:left;width:60px}
.sg-dn{font-size:20px;font-weight:800;display:block;color:var(--t1);line-height:1}
.sg-dw{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.03em;display:block;margin-top:2px}
.sg-chk{font-size:11px;color:var(--gr);display:block;margin-top:1px;font-weight:700}

.sg-amt{text-align:right;font-size:15px;font-weight:700;white-space:nowrap}
.sg-amt.entrada{color:var(--gr)}
.sg-amt.saida{color:var(--rd)}
.sg-amt.cartao{color:var(--bl)}
.sg-amt.economia{color:var(--pu)}
.sg-z{color:var(--br2);font-size:13px;font-weight:400}
.sg-proj{opacity:.7;font-style:italic}

.sg-sal-cell{text-align:right;padding:8px 16px 8px 8px!important}
.sg-sal-inner{display:inline-block;padding:7px 12px;border-radius:8px;font-size:15px;font-weight:700;min-width:108px;text-align:right;white-space:nowrap}
.sg-sal-inner.pos{background:rgba(34,197,94,.15);color:#22C55E}
.sg-sal-inner.neg{background:rgba(239,68,68,.15);color:#EF4444}

.sg-today{background:rgba(255,89,23,.1)!important}
.sg-today .sg-dn{color:var(--or)}
.sg-today .sg-dw,.sg-today .sg-chk{color:var(--t2)}
.sg-today .sg-amt{color:var(--t1)!important}
.sg-today .sg-z{color:var(--t3)}
.sg-today .sg-sal-inner.pos{background:rgba(34,197,94,.2);color:#22C55E}
.sg-today .sg-sal-inner.neg{background:rgba(239,68,68,.2);color:#EF4444}
.sg-future{opacity:.72}
.sg-future .sg-dn{color:var(--t3)}

/* keep tx-val for tx-detail modal */
.tx-val{font-size:15px;font-weight:700;flex-shrink:0}
.tx-val.entrada{color:var(--gr)}
.tx-val.saida{color:var(--rd)}
.tx-val.cartao{color:var(--bl)}
.tx-val.economia{color:var(--pu)}

/* ── TOTAIS PAGE ────────────────────────── */
.tot-hdr{padding:18px 16px 4px}
.tot-hdr h2{font-size:18px;font-weight:700;color:var(--t1)}

.mcard{background:var(--card);margin:8px 16px 0;border-radius:18px;border:1px solid var(--br);overflow:hidden;box-shadow:var(--shadow)}
.mcard-in{padding:18px}
.mc-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--t3);text-transform:uppercase}
.mc-val{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.6px}
.mc-sub{font-size:12px;color:var(--t2);margin-top:3px}
.mc-val.g{color:var(--gr)} .mc-val.r{color:var(--rd)} .mc-val.o{color:var(--or)}
.dots{display:flex;gap:5px;margin-top:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--br)}
.dot.g{background:var(--gr)} .dot.y{background:var(--am)} .dot.r{background:var(--rd)}
.pbar-wrap{margin-top:10px;background:var(--br);border-radius:999px;height:7px;overflow:hidden}
.pbar{height:100%;border-radius:999px;transition:width .5s}
.mcard-rows{border-top:1px solid var(--br)}
.mcard-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--br)}
.mcard-row:last-child{border-bottom:none}
.mcard-row span:first-child{font-size:14px;color:var(--t2)}
.mcard-row span:last-child{font-size:14px;font-weight:700}

/* ── TAGS PAGE ──────────────────────────── */
.tags-hdr{padding:18px 16px 4px}
.tags-hdr h2{font-size:18px;font-weight:700;color:var(--t1)}
.tags-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 4px}
.tag-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:opacity .12s}
.tag-chip:active{opacity:.7}
.tag-chip-count{font-size:11px;opacity:.65;font-weight:600}
.tag-back{display:flex;align-items:center;gap:6px;padding:14px 16px 6px;font-size:15px;font-weight:700;color:var(--or);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif}
.tag-detail-sum{background:var(--card);margin:8px 16px 0;border-radius:16px;border:1px solid var(--br);padding:16px}
.tag-detail-name{font-size:22px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tag-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag-detail-item{background:var(--bg);border-radius:12px;padding:10px}
.tag-detail-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-bottom:3px;text-transform:uppercase}
.tag-detail-val{font-size:17px;font-weight:700}
.tag-empty{padding:12px 16px 0}
.tag-all-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--br);cursor:pointer;gap:10px}
.tag-all-row:last-child{border-bottom:none}
.tag-all-row:active{background:var(--bg)}
.tag-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.tag-all-name{flex:1;font-size:14px;font-weight:600}
.tag-all-count{font-size:12px;color:var(--t3);margin-right:8px}
.tag-all-val{font-size:14px;font-weight:700}

/* ── ADD MODAL ──────────────────────────── */
#add-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
#add-modal.off{display:none}
.add-sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:560px;padding-bottom:calc(var(--sb) + 16px);border-top:1px solid rgba(255,255,255,.1)}
.add-handle{width:36px;height:4px;background:var(--br);border-radius:2px;margin:12px auto 0}
.add-types{display:flex;gap:6px;padding:14px 16px 0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.add-types::-webkit-scrollbar{display:none}
.atype{flex:1;min-width:0;padding:9px 8px;text-align:center;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;border:1.5px solid var(--br);background:var(--bg);cursor:pointer;color:var(--t2);border-radius:999px;transition:all .15s;white-space:nowrap}
.atype.on{border-color:var(--cur-color,var(--or));background:var(--cur-bg,var(--or-l));color:var(--cur-color,var(--or))}
.add-body{padding:16px 20px 4px}
.add-amt-wrap{text-align:center;padding:4px 0 16px;border-bottom:1px solid var(--br);margin-bottom:16px}
.add-amt-lbl{font-size:11px;color:var(--t3);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.add-amt-row{display:flex;align-items:baseline;justify-content:center;gap:6px}
.add-amt-prefix{font-size:24px;font-weight:800;color:var(--t3);line-height:1}
#add-amt{font-size:42px;font-weight:800;border:none;outline:none;text-align:center;width:160px;background:transparent;font-family:'DM Sans',sans-serif;color:var(--t1);letter-spacing:-1px}
.afield{margin-bottom:14px}
.afield label{font-size:11px;color:var(--t3);font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.afield input,.afield select{width:100%;border:1px solid var(--br);border-radius:14px;padding:12px 14px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;background:var(--card2);color:var(--t1);appearance:none;transition:border-color .15s}
.afield input:focus,.afield select:focus{border-color:var(--cur-color,var(--or))}
.add-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.add-tag-pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--br);background:var(--bg);color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .1s}
.add-tag-pill.sel{border-color:var(--cur-color,var(--or));background:var(--cur-bg,var(--or-l));color:var(--cur-color,var(--or))}
.add-save{display:block;width:100%;padding:15px;background:var(--cur-color,var(--or));color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:12px;transition:all .2s}
.add-save:active{opacity:.8}
.add-save:disabled{opacity:.4}

/* ── TX DETAIL MODAL ────────────────────── */
#tx-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
#tx-modal.off{display:none}
.tx-sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:560px;padding:20px 20px calc(var(--sb) + 20px);border-top:1px solid rgba(255,255,255,.1)}
.tx-sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.tx-sheet-hdr h3{font-size:18px;font-weight:700}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tx-detail-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--br)}
.tx-detail-row:last-child{border-bottom:none}
.tx-detail-lbl{font-size:14px;color:var(--t2)}
.tx-detail-val{font-size:14px;font-weight:600}
.tx-tags-wrap{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.tx-tag-badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.btn-del{display:block;width:100%;padding:13px;background:var(--rd-l);color:var(--rd);border:none;border-radius:999px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:20px;transition:opacity .15s}
.btn-del:active{opacity:.7}

/* ── MENU PAGE ──────────────────────────── */
.menu-hdr{padding:24px 16px 12px}
.menu-hdr h2{font-size:22px;font-weight:700}
.msec{padding:0 16px 12px}
.msec-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.mcard2{background:var(--card);border-radius:16px;border:1px solid var(--br);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--br)}
.mrow:last-child{border-bottom:none}
.mrow-ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mrow-body{flex:1}
.mrow-title{font-size:15px;font-weight:600}
.mrow-sub{font-size:13px;color:var(--t3);margin-top:1px}
.btn-out{display:block;width:calc(100% - 32px);margin:8px 16px 20px;padding:13px;border:1.5px solid var(--br);background:none;border-radius:999px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--t2)}

/* ── CONTAS PAGE ────────────────────────── */
.cv-hdr{padding:20px 16px 8px}
.cv-hdr h2{font-size:22px;font-weight:700}
.cv-sec{padding:0 16px 12px}
.cv-sec-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cv-card{background:var(--card);border-radius:16px;border:1px solid var(--br);overflow:hidden}
.cv-item{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--br)}
.cv-item:last-child{border-bottom:none}

// ── AUTH ───────────────────────────────────────────────────────
async function sha256(msg){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const pwd = document.getElementById('pwd').value;
  const hash = await sha256(pwd);
  if(hash === PWD_HASH){
    localStorage.setItem('auth','1');
    boot();
  } else {
    document.getElementById('lerr').textContent = 'Senha incorreta';
  }
}
function checkAuth(){
  if(localStorage.getItem('auth')==='1') boot();
}
function logout(){
  localStorage.removeItem('auth');
  location.reload();
}

// ── SUPABASE ───────────────────────────────────────────────────
async function sb(table, params={}, opts={}){
  const url = new URL(`${SUPA_URL}/rest/v1/${table}`);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r = await fetch(url, {
    method: opts.method||'GET',
    headers:{
      'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      'Prefer': opts.prefer||'return=representation',
      ...(opts.headers||{})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!r.ok){ console.error(r.status, await r.text()); return null; }
  if(r.status===204) return null;
  return r.json();
}

// ── HELPERS ────────────────────────────────────────────────────
function brl(n){
  return 'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function brlSign(n){
  return (n>=0?'+':'-')+' '+brl(n);
}
function pad2(n){return String(n).padStart(2,'0')}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function mStr(y,m){return MOS[m]+'/'+String(y).slice(2)}
function dStr(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`}
function dowOf(s){return DOW[new Date(s+'T12:00:00').getDay()]}
function todayStr(){return dStr(_now.getFullYear(),_now.getMonth(),_now.getDate())}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function parseTags(raw){
  if(!raw) return [];
  return raw.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
}

// ── NAVIGATION ─────────────────────────────────────────────────
const PAGE_TITLES={saldos:'saldos',totais:'totais',tags:'tags',contas:'contas',menu:'menu'};
function goTo(tab){
  _tab = tab;
  ['saldos','totais','tags','contas','menu'].forEach(t=>{
    document.getElementById('pg-'+t).classList.toggle('off', t!==tab);
    const b = document.getElementById('bn-'+t);
    if(b) b.classList.toggle('on', t===tab);
    const sbi = document.getElementById('sbi-'+t);
    if(sbi) sbi.classList.toggle('on', t===tab);
  });
  const titleEl=document.getElementById('hdr-page-title');
  if(titleEl) titleEl.textContent=PAGE_TITLES[tab]||tab;
  if(tab==='totais') renderTotais();
  if(tab==='tags')   renderTags();
  if(tab==='contas') renderContas();
  if(tab==='menu')   renderMenu();
}
function prevM(){
  if(_mo===0){_mo=11;_yr--;}else _mo--;
  updateHdr(); _selTag=null; loadData();
}
function nextM(){
  if(_mo===11){_mo=0;_yr++;}else _mo++;
  updateHdr(); _selTag=null; loadData();
}
function skipMonths(n){
  _mo+=n; while(_mo<0){_mo+=12;_yr--;} while(_mo>11){_mo-=12;_yr++;}
  updateHdr(); _selTag=null; loadData();
}
function updateHdr(){document.getElementById('hdr-title').textContent=mStr(_yr,_mo);
  const d=_now.getDate();
  const ic=document.getElementById('sb-today-ic');
  if(ic) ic.textContent=(_yr===_now.getFullYear()&&_mo===_now.getMonth())?'↻':'↻';
}

// ── LOAD DATA ──────────────────────────────────────────────────
async function loadData(){
  document.getElementById('saldos-list').innerHTML='<div class="loading"><span class="spin">⟳</span> Carregando...</div>';
  const from = dStr(_yr,_mo,1);
  const to   = dStr(_yr,_mo,dim(_yr,_mo));

  const [txData,accData,fcData,subData,instData] = await Promise.all([
    sb('transactions',{
      select:'id,date,description,amount,type,category,tags',
      'date':'gte.'+from,
      order:'date.asc',
      limit:2000
    }),
    sb('accounts',{select:'id,name,bank,balance,type'}),
    sb('fixed_costs',{select:'id,description,amount,due_day,category,account',order:'due_day.asc'}),
    sb('subscriptions',{select:'id,name,amount,card,category,billing_day,emoji,active',order:'billing_day.asc'}),
    sb('installments',{select:'id,description,installment_amount,current_installment,total_installments,card,emoji,active',order:'card.asc'})
  ]);

  _txs      = (txData||[]).filter(t=>t.date>=from && t.date<=to);
  _accs     = accData||[];
  _fixedCosts = fcData||[];
  _subs     = (subData||[]).filter(s=>s.active!==false);
  _installs = (instData||[]).filter(i=>i.active!==false);

  // Carrega mês anterior para multi-mês
  _txs2=[]; _allTxs=[..._txs];
  if(_multiMo){
    let yr2=_yr,mo2=_mo-1;
    if(mo2<0){mo2=11;yr2--;}
    const from2=dStr(yr2,mo2,1),to2=dStr(yr2,mo2,dim(yr2,mo2));
    const txData2=await sb('transactions',{select:'id,date,description,amount,type,category,tags','date':'gte.'+from2,order:'date.asc',limit:2000});
    _txs2=(txData2||[]).filter(t=>t.date>=from2&&t.date<=to2);
    _allTxs=[..._txs2,..._txs];
  }

  renderSaldos();
  if(_tab==='totais') renderTotais();
  if(_tab==='tags')   renderTags();
  if(_tab==='contas') renderContas();
  if(_tab==='menu')   renderMenu();
}

// ── SALDOS TABLE V2 (multi-coluna, estilo App Breno) ───────────
function renderSaldos(){
  const el=document.getElementById('saldos-list');
  if(!el) return;

  const totalBal=_accs.reduce((s,a)=>s+parseFloat(a.balance||0),0);
  const isInc =t=>['income','entrada'].includes(t.type);
  const isEco =t=>['savings','economia','investment'].includes(t.type);
  const isCart=t=>['card','cartao','transfer'].includes(t.type);
  const isDay =t=>['daily','diario'].includes(t.type);
  const isSai =t=>['expense','saida'].includes(t.type);

  const byDate={};
  _txs.forEach(t=>{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);});

  const nowDate=new Date();
  const isCurMo=(_yr===nowDate.getFullYear()&&_mo===nowDate.getMonth());
  const todayDay=isCurMo?nowDate.getDate():-1;
  const daysInMo=dim(_yr,_mo);

  const projMap={};
  if(isCurMo){
    const paid=amt=>_txs.some(t=>!isInc(t)&&!isEco(t)&&Math.abs(parseFloat(t.amount)-amt)<0.05);
    _fixedCosts.forEach(fc=>{const d=fc.due_day||1;if(d>todayDay&&!paid(parseFloat(fc.amount)))projMap[d]=(projMap[d]||0)+parseFloat(fc.amount);});
    _subs.forEach(s=>{const d=s.billing_day||1;if(d>todayDay)projMap[d]=(projMap[d]||0)+parseFloat(s.amount);});
  }

  // Passo 1: coleta dados por dia
  let tE=0,tS=0,tD=0,tEc=0,tC=0;
  const dayData={};
  for(let day=1;day<=daysInMo;day++){
    const ds=dStr(_yr,_mo,day);
    const dayTxs=byDate[ds]||[];
    const isFut=isCurMo&&day>todayDay;
    const isToday=isCurMo&&day===todayDay;
    let entr=0,sai=0,daily=0,eco=0,cart=0;
    dayTxs.forEach(t=>{
      const a=parseFloat(t.amount||0);
      if(isInc(t)) entr+=a;
      else if(isEco(t)) eco+=a;
      else if(isCart(t)) cart+=a;
      else if(isDay(t)) daily+=a;
      else if(isSai(t)) sai+=a;
    });
    const proj=projMap[day]||0;
    dayData[day]={ds,entr,sai,daily,eco,cart,proj,net:entr-sai-daily-eco-cart,isFut,isToday};
    tE+=entr;tS+=sai;tD+=daily;tEc+=eco;tC+=cart;
  }

  // Passo 2: calcula saldo de cada dia
  // Para o mês atual: âncora = saldo de hoje (totalBal); vai pra trás/frente
  // Para meses passados: acumula do início usando totalBal - monthNet
  const saldoArr={};
  if(isCurMo){
    saldoArr[todayDay]=totalBal;
    for(let d=todayDay-1;d>=1;d--) saldoArr[d]=saldoArr[d+1]-dayData[d+1].net;
    for(let d=todayDay+1;d<=daysInMo;d++){
      const dd=dayData[d];
      saldoArr[d]=saldoArr[d-1]+dd.net-(dd.isFut?dd.proj:0);
    }
  } else {
    const monthNet=_txs.reduce((s,t)=>{const a=parseFloat(t.amount||0);return isInc(t)?s+a:s-a;},0);
    let run=totalBal-monthNet;
    for(let day=1;day<=daysInMo;day++){run+=dayData[day].net;saldoArr[day]=run;}
  }

  const DOW2=['dom','seg','ter','qua','qui','sex','sáb'];
  const ic=(on,color,lbl='')=>`<span class="sg2-ic" style="background:${on?color:'var(--br)'};${on?'':'opacity:.45'}">${lbl}</span>`;
  const brlSaldo=v=>(v<0?'-':'')+brl(v);
  const val=(v,color,proj=false)=>proj
    ?`<span class="sg2-proj-box">${brl(v)}</span>`
    :(v?`<span class="sg2-v-act" style="color:${color}">${brl(v)}</span>`:`<span class="sg2-v-zero">${brl(0)}</span>`);

  const rows=[];
  for(let day=1;day<=daysInMo;day++){
    const {ds,entr,sai,daily,eco,cart,proj,isFut,isToday}=dayData[day];
    const runSaldo=saldoArr[day];
    const dow=DOW2[new Date(ds+'T12:00:00').getDay()];
    const saiShow=sai||(isFut?proj:0);
    const saiProj=isFut&&!sai&&proj>0;
    const hasData=entr||sai||daily||eco||cart;
    const isPast=isCurMo&&day<todayDay;

    // Gradiente de cor do saldo — verde escuro→claro→amarelo→laranja→vermelho
    let salBg,salColor;
    if(isToday){salBg='transparent';salColor='var(--t1)';}
    else if(runSaldo<0)    {salBg='rgba(239,68,68,.26)';  salColor='#EF4444';}  // vermelho
    else if(runSaldo<200)  {salBg='rgba(255,89,23,.26)';  salColor='#FF5917';}  // laranja atenção
    else if(runSaldo<800)  {salBg='rgba(234,179,8,.28)';  salColor='#CA8A04';}  // amarelo
    else if(runSaldo<3000) {salBg='rgba(34,197,94,.14)';  salColor='#22C55E';}  // verde claro
    else if(runSaldo<10000){salBg='rgba(34,197,94,.26)';  salColor='#22C55E';}  // verde médio
    else                   {salBg='rgba(34,197,94,.42)';  salColor='#16A34A';}  // verde escuro

    let rowCls='sg2-row';
    if(isToday) rowCls+=' sg2-today-row';
    else if(isFut) rowCls+=' sg2-future-row';
    else if(isPast&&!hasData) rowCls+=' sg2-past-empty';
    else if(isPast) rowCls+=' sg2-past-row';

    rows.push(`<tr class="${rowCls}" onclick="openDayDetail('${ds}')">
      <td class="sg2-td-day">
        <span class="${isToday?'sg2-today-n':'sg2-day-n'}">${day}</span>
        <span class="sg2-day-w">${dow}</span>
      </td>
      <td class="sg2-td-v">${ic(entr>0,'#22C55E','↙')} ${val(entr,'#22C55E')}</td>
      <td class="sg2-td-v">${ic(!!(saiShow),'#EF4444','↗')} ${val(saiShow,'#EF4444',saiProj)}</td>
      <td class="sg2-td-v">${ic(daily>0,'#EC4899','D')} ${val(daily,'#EC4899')}</td>
      <td class="sg2-td-v">${ic(eco>0,'#22C55E','E')} ${val(eco,'#8B5CF6')}</td>
      <td class="sg2-td-v">${ic(cart>0,'#8B5CF6','C')} ${val(cart,'#3B82F6')}</td>
      <td class="sg2-td-sal" style="background:${salBg}"><span style="color:${salColor};font-size:13px;font-weight:700">${brlSaldo(runSaldo)}</span></td>
    </tr>`);
  }

  // Tabela do mês atual
  const tableHtml=(rowsArr,tEntr,tSai,tDai,tEco,tCar)=>`
  <div class="sg2-scroll">
  <table class="sg2-table">
    <thead><tr class="sg2-hdr-row">
      <th class="sg2-th-day">dia</th>
      <th class="sg2-th-v"><span class="sg2-ic" style="background:#22C55E">↙</span> entradas</th>
      <th class="sg2-th-v"><span class="sg2-ic" style="background:#EF4444">↗</span> saídas</th>
      <th class="sg2-th-v"><span class="sg2-ic" style="background:#EC4899">D</span> diários</th>
      <th class="sg2-th-v"><span class="sg2-ic" style="background:#22C55E">E</span> economias</th>
      <th class="sg2-th-v"><span class="sg2-ic" style="background:#8B5CF6">C</span> cartão</th>
      <th class="sg2-th-sal">saldos</th>
    </tr></thead>
    <tbody>${rowsArr.join('')}</tbody>
    <tfoot><tr class="sg2-foot-row">
      <td class="sg2-td-day"></td>
      <td class="sg2-td-v"><span class="sg2-ic" style="background:#22C55E">↙</span><span style="color:#22C55E;font-weight:700">${brl(tEntr)}</span></td>
      <td class="sg2-td-v"><span class="sg2-ic" style="background:#EF4444">↗</span><span style="color:#EF4444;font-weight:700">${brl(tSai)}</span></td>
      <td class="sg2-td-v"><span class="sg2-ic" style="background:#EC4899">D</span><span style="color:#EC4899;font-weight:700">${brl(tDai)}</span></td>
      <td class="sg2-td-v"><span class="sg2-ic" style="background:#22C55E">E</span><span style="color:#8B5CF6;font-weight:700">${brl(tEco)}</span></td>
      <td class="sg2-td-v"><span class="sg2-ic" style="background:#8B5CF6">C</span><span style="color:#3B82F6;font-weight:700">${brl(tCar)}</span></td>
      <td></td>
    </tr></tfoot>
  </table>
  </div>`;

  // Multi-mês: constrói bloco do mês anterior
  let prevBlock='';
  if(_multiMo&&_txs2.length>0){
    let yr2=_yr,mo2=_mo-1;
    if(mo2<0){mo2=11;yr2--;}
    const daysInMo2=dim(yr2,mo2);
    const byDate2={};
    _txs2.forEach(t=>{if(!byDate2[t.date])byDate2[t.date]=[];byDate2[t.date].push(t);});
    let tE2=0,tS2=0,tD2=0,tEc2=0,tC2=0;
    const rows2=[];
    const saldo2={};
    const monthNet2=_txs2.reduce((s,t)=>{const a=parseFloat(t.amount||0);return isInc(t)?s+a:s-a;},0);
    let run2=totalBal-monthNet2-(Object.values(saldoArr).length?saldoArr[1]-dayData[1].net:0);
    for(let day=1;day<=daysInMo2;day++){
      const ds2=dStr(yr2,mo2,day);
      const dayTxs2=byDate2[ds2]||[];
      let entr2=0,sai2=0,daily2=0,eco2=0,cart2=0;
      dayTxs2.forEach(t=>{const a=parseFloat(t.amount||0);if(isInc(t))entr2+=a;else if(isEco(t))eco2+=a;else if(isCart(t))cart2+=a;else if(isDay(t))daily2+=a;else if(isSai(t))sai2+=a;});
      run2+=entr2-sai2-daily2-eco2-cart2;
      saldo2[day]=run2;
      tE2+=entr2;tS2+=sai2;tD2+=daily2;tEc2+=eco2;tC2+=cart2;
      const dow2=DOW2[new Date(ds2+'T12:00:00').getDay()];
      const hasData2=entr2||sai2||daily2||eco2||cart2;
      let sBg2,sCol2;
      if(run2<0){sBg2='rgba(239,68,68,.26)';sCol2='#EF4444';}
      else if(run2<200){sBg2='rgba(255,89,23,.26)';sCol2='#FF5917';}
      else if(run2<800){sBg2='rgba(234,179,8,.28)';sCol2='#CA8A04';}
      else if(run2<3000){sBg2='rgba(34,197,94,.14)';sCol2='#22C55E';}
      else if(run2<10000){sBg2='rgba(34,197,94,.26)';sCol2='#22C55E';}
      else{sBg2='rgba(34,197,94,.42)';sCol2='#16A34A';}
      rows2.push(`<tr class="sg2-row${!hasData2?' sg2-past-empty':''}" onclick="openDayDetail('${ds2}')">
        <td class="sg2-td-day"><span class="sg2-day-n">${day}</span><span class="sg2-day-w">${dow2}</span></td>
        <td class="sg2-td-v">${ic(entr2>0,'#22C55E','↙')} ${val(entr2,'#22C55E')}</td>
        <td class="sg2-td-v">${ic(!!(sai2),'#EF4444','↗')} ${val(sai2,'#EF4444')}</td>
        <td class="sg2-td-v">${ic(daily2>0,'#EC4899','D')} ${val(daily2,'#EC4899')}</td>
        <td class="sg2-td-v">${ic(eco2>0,'#22C55E','E')} ${val(eco2,'#8B5CF6')}</td>
        <td class="sg2-td-v">${ic(cart2>0,'#8B5CF6','C')} ${val(cart2,'#3B82F6')}</td>
        <td class="sg2-td-sal" style="background:${sBg2}"><span style="color:${sCol2};font-size:13px;font-weight:700">${brlSaldo(run2)}</span></td>
      </tr>`);
    }
    prevBlock=`<div class="sg2-month-block"><div class="sg2-month-hdr"><span class="sg2-month-hdr-lbl">${MOS_FULL[mo2]} de ${yr2}</span></div>${tableHtml(rows2,tE2,tS2,tD2,tEc2,tC2)}</div>`;
  }

  const multiClass=_multiMo?'sg2-multi-wrap':'';
  const curBlock=`<div class="sg2-month-block"><div class="sg2-month-hdr"><span class="sg2-month-hdr-lbl">${MOS_FULL[_mo]} de ${_yr}</span></div>${tableHtml(rows,tE,tS,tD,tEc,tC)}</div>`;

  el.innerHTML=`
  <div class="sg2-search-bar">
    <span class="sg2-search-ic">🔍</span>
    <input class="sg2-search-input" id="sg2-search-inp" type="search" placeholder="Buscar por descrição, categoria, tag..." value="${_searchQ}" oninput="applySearch()">
    <button class="sg2-search-clear${_searchQ?' vis':''}" id="sg2-search-clear" onclick="clearSearch()">×</button>
    <button class="sg2-multi-btn${_multiMo?' on':''}" id="sg2-multi-toggle" onclick="toggleMultiMo()">${_multiMo?'✕ 1 mês':'⊞ 2 meses'}</button>
  </div>
  <div class="sg2-filter-chips">
    <button class="sg2-chip${_filterType==='all'?' on':''}" data-ft="all" onclick="setFilterType('all')">Todos</button>
    <button class="sg2-chip${_filterType==='income'?' on':''}" data-ft="income" onclick="setFilterType('income')" style="${_filterType==='income'?'--chip-c:#22C55E;--chip-bg:rgba(34,197,94,.15)':''}">Entradas</button>
    <button class="sg2-chip${_filterType==='expense'?' on':''}" data-ft="expense" onclick="setFilterType('expense')" style="${_filterType==='expense'?'--chip-c:#EF4444;--chip-bg:rgba(239,68,68,.15)':''}">Saídas</button>
    <button class="sg2-chip${_filterType==='daily'?' on':''}" data-ft="daily" onclick="setFilterType('daily')" style="${_filterType==='daily'?'--chip-c:#EC4899;--chip-bg:rgba(236,72,153,.15)':''}">Diários</button>
    <button class="sg2-chip${_filterType==='card'?' on':''}" data-ft="card" onclick="setFilterType('card')" style="${_filterType==='card'?'--chip-c:#3B82F6;--chip-bg:rgba(59,130,246,.15)':''}">Cartão</button>
    <button class="sg2-chip${_filterType==='savings'?' on':''}" data-ft="savings" onclick="setFilterType('savings')" style="${_filterType==='savings'?'--chip-c:#8B5CF6;--chip-bg:rgba(139,92,246,.15)':''}">Economias</button>
  </div>
  <div id="sg2-results" style="display:none"></div>
  <div id="sg2-table-wrap" class="${multiClass}">${prevBlock}${curBlock}</div>`;

  setTimeout(()=>{ renderSearchResults(); },0);
}

// ── TX DETAIL ──────────────────────────────────────────────────
function openTx(id){
  const pool=_allTxs.length?_allTxs:_txs;
  const t=pool.find(x=>x.id===id);
  if(!t) return;
  _curTx=t;
  const cls=TIPO_CLS[t.type]||'saida';
  const amt=parseFloat(t.amount||0);
  const sign=t.type==='income'||t.type==='entrada'?'+':'-';
  const d=new Date(t.date+'T12:00:00');
  const dateLabel=`${d.getDate()} de ${MOS[d.getMonth()]} de ${d.getFullYear()}`;
  const tags=parseTags(t.tags);
  const tagsHtml=tags.length?`<div class="tx-tags-wrap">${tags.map((tag,i)=>{
    const c=TAG_COLORS[i%TAG_COLORS.length];
    return `<span class="tx-tag-badge" style="background:${c}20;color:${c}">${esc(tag)}</span>`;
  }).join('')}</div>`:`<span class="tx-detail-val" style="color:var(--t3)">—</span>`;

  document.getElementById('tx-detail-body').innerHTML=`
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Tipo</span>
      <span class="tx-detail-val tx-val ${cls}">${TIPO_LBL[t.type]||t.type}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Valor</span>
      <span class="tx-detail-val tx-val ${cls}">${sign} ${brl(amt)}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Descrição</span>
      <span class="tx-detail-val">${esc(t.description||'—')}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Categoria</span>
      <span class="tx-detail-val">${esc(t.category||'—')}</span>
    </div>
    <div class="tx-detail-row">
      <span class="tx-detail-lbl">Data</span>
      <span class="tx-detail-val">${dateLabel}</span>
    </div>
    <div class="tx-detail-row" style="align-items:flex-start;gap:12px">
      <span class="tx-detail-lbl">Tags</span>
      ${tagsHtml}
    </div>`;

  document.getElementById('tx-del-btn').onclick=()=>deleteTx(id);
  document.getElementById('tx-edit-btn').onclick=()=>{ closeTx(); openEdit(t); };
  document.getElementById('tx-modal').classList.remove('off');
}
function closeTx(){ document.getElementById('tx-modal').classList.add('off'); }
async function deleteTx(id){
  if(!confirm('Excluir esta movimentação?')) return;
  await sb('transactions',{id:'eq.'+id},{method:'DELETE',prefer:'return=minimal'});
  closeTx();
  loadData();
}

function openEdit(tx){
  _editId = tx.id;
  openAdd();
  document.getElementById('add-amt').value = parseFloat(tx.amount||0);
  document.getElementById('add-desc').value = tx.description||'';
  document.getElementById('add-date').value = tx.date||'';
  document.getElementById('add-cat').value = tx.category||'';
  document.getElementById('add-tag-input').value = tx.tags||'';
  const typeMap={'income':'income','entrada':'income','expense':'expense','saida':'expense','daily':'daily','diario':'daily','card':'card','cartao':'card','savings':'savings','economia':'savings'};
  const mapped=typeMap[tx.type]||'expense';
  const btn=document.querySelector(`.atype[onclick*="'${mapped}'"]`);
  if(btn) setAType(mapped, btn);
  document.getElementById('add-btn').textContent='Atualizar';
}

async function updateTx(id, data){
  const r = await fetch(`${SUPA_URL}/rest/v1/transactions?id=eq.${id}`, {
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(data)
  });
  return r;
}

// ── TOTAIS ─────────────────────────────────────────────────────
function renderTotais(){
  const el=document.getElementById('totais-content');
  if(!el) return;

  const totalBal=_accs.reduce((s,a)=>s+parseFloat(a.balance||0),0);
  let entradas=0,saidas=0,cartao=0,economia=0;
  _txs.forEach(t=>{
    const a=parseFloat(t.amount||0);
    const tp=t.type;
    if(tp==='income'||tp==='entrada') entradas+=a;
    else if(tp==='expense'||tp==='saida') saidas+=a;
    else if(tp==='card'||tp==='cartao'||tp==='transfer') cartao+=a;
    else if(tp==='savings'||tp==='economia'||tp==='investment') economia+=a;
  });

  const custoVida=saidas+cartao;
  const sobrou=entradas-custoVida-economia;
  const pctEcon=entradas>0?(economia/entradas*100):0;
  const pctCusto=entradas>0?(custoVida/entradas*100):100;
  const hoje=new Date();
  const diasP=(_yr===hoje.getFullYear()&&_mo===hoje.getMonth())?hoje.getDate():dim(_yr,_mo);
  const diarioMed=diasP>0?custoVida/diasP:0;

  let score=0;
  if(entradas>0) score++;
  if(sobrou>=0) score++;
  if(pctEcon>=10) score++;
  if(pctEcon>=20) score++;
  if(pctCusto<=70) score++;

  function dots(s){
    let h='<div class="dots">';
    for(let i=0;i<5;i++){
      const c=i<s?(s>=4?'g':s>=3?'y':'r'):'';
      h+=`<div class="dot ${c}"></div>`;
    }
    return h+'</div>';
  }

  const sPos=sobrou>=0;
  const eCls=pctEcon>=20?'g':pctEcon>=10?'o':'r';
  const ePBarColor=pctEcon>=10?'var(--gr)':pctEcon>0?'var(--or)':'var(--rd)';

  el.innerHTML=`
  <div class="tot-hdr"><h2>Totais · ${mStr(_yr,_mo)}</h2></div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Performance</div>
      <div class="mc-val ${sPos?'g':'r'}">${brl(Math.abs(sobrou))}</div>
      <div class="mc-sub">${sPos?'Sobrou no mês':'Faltou dinheiro'}</div>
      ${dots(score)}
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Economizado</div>
      <div class="mc-val ${eCls}">${pctEcon.toFixed(0)}%</div>
      <div class="mc-sub">${pctEcon>=20?'Excelente':pctEcon>=10?'Bom':pctEcon>0?'Atenção':'Nada guardado'}</div>
      <div class="pbar-wrap"><div class="pbar" style="width:${Math.min(pctEcon,100)}%;background:${ePBarColor}"></div></div>
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Custo de Vida</div>
      <div class="mc-val">${brl(custoVida)}</div>
      <div class="mc-sub">${entradas>0?pctCusto.toFixed(0)+'% da renda':'Sem receita no mês'}</div>
    </div>
  </div>

  <div class="mcard">
    <div class="mcard-in">
      <div class="mc-label">Diário Médio</div>
      <div class="mc-val">${brl(diarioMed)}</div>
      <div class="mc-sub">Baseado em ${diasP} dias</div>
    </div>
  </div>

  <div class="mcard" style="margin-top:12px;margin-bottom:4px">
    <div class="mcard-in"><div class="mc-label">Resumo do Mês</div></div>
    <div class="mcard-rows">
      ${mrow('Entradas','+ '+brl(entradas),'color:var(--gr)')}
      ${mrow('Saídas','− '+brl(saidas),'color:var(--rd)')}
      ${mrow('Cartão','− '+brl(cartao),'color:var(--bl)')}
      ${mrow('Economia','+ '+brl(economia),'color:var(--pu)')}
      ${mrow('Saldo Atual',brl(totalBal),totalBal>=0?'color:var(--gr)':'color:var(--rd)')}
    </div>
  </div>
  ${renderComprometimento()}`;
}

function renderComprometimento(){
  const totalFixas=_fixedCosts.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalSubs=_subs.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalInst=_installs.reduce((s,c)=>s+parseFloat(c.installment_amount||0),0);
  const totalC=totalFixas+totalSubs+totalInst;
  if(!totalC) return '';
  return `
  <div class="mcard" style="margin-top:8px;margin-bottom:4px">
    <div class="mcard-in"><div class="mc-label">Comprometimento Mensal</div></div>
    <div class="mcard-rows">
      ${mrow('Contas Fixas',brl(totalFixas),'color:var(--rd)')}
      ${mrow('Assinaturas',brl(totalSubs),'color:var(--rd)')}
      ${mrow('Parcelamentos',brl(totalInst),'color:var(--rd)')}
      ${mrow('Total comprometido',brl(totalC),'color:var(--rd);font-weight:800')}
    </div>
  </div>`;
}

function mrow(l,v,style=''){
  return `<div class="mcard-row"><span>${l}</span><span style="${style}">${v}</span></div>`;
}

// ── TAGS ───────────────────────────────────────────────────────
function renderTags(){
  const el=document.getElementById('tags-content');
  if(!el) return;

  // Montar mapa de tags com stats
  const tagMap={};
  _txs.forEach(t=>{
    const tags=parseTags(t.tags);
    tags.forEach(tag=>{
      if(!tagMap[tag]) tagMap[tag]={count:0,in:0,out:0,txs:[]};
      tagMap[tag].count++;
      const a=parseFloat(t.amount||0);
      const isInc=['income','entrada'].includes(t.type);
      if(isInc) tagMap[tag].in+=a; else tagMap[tag].out+=a;
      tagMap[tag].txs.push(t);
    });
  });

  const tagNames=Object.keys(tagMap).sort();

  // Visão de detalhe de uma tag
  if(_selTag && tagMap[_selTag]){
    const g=tagMap[_selTag];
    const net=g.in-g.out;
    const colorIdx=tagNames.indexOf(_selTag);
    const color=TAG_COLORS[colorIdx%TAG_COLORS.length];

    const txRows=g.txs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{
      const a=parseFloat(t.amount||0);
      const cls=TIPO_CLS[t.type]||'saida';
      const sign=['income','entrada'].includes(t.type)?'+':'-';
      const d=new Date(t.date+'T12:00:00');
      const dow=['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];
      return `<div class="cv-item" onclick="openTx(${t.id})" style="cursor:pointer">
        <div class="cv-day"><div class="cv-day-n">${d.getDate()}</div><div class="cv-day-s">${dow.toUpperCase()}</div></div>
        <div class="cv-body">
          <div class="cv-name">${esc(t.description||'—')}</div>
          <div class="cv-sub">${esc(t.category||'')}</div>
        </div>
        <div class="cv-amt tx-val ${cls}">${sign} ${brl(a)}</div>
      </div>`;
    }).join('');

    el.innerHTML=`
    <button class="tag-back" onclick="_selTag=null;renderTags()">‹ Todas as tags</button>
    <div class="tag-detail-sum">
      <div class="tag-detail-name">
        <span style="width:14px;height:14px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0"></span>
        ${esc(_selTag)}
      </div>
      <div class="tag-detail-grid">
        <div class="tag-detail-item">
          <div class="tag-detail-lbl">Entradas</div>
          <div class="tag-detail-val" style="color:var(--gr)">${brl(g.in)}</div>
        </div>
        <div class="tag-detail-item">
          <div class="tag-detail-lbl">Saídas</div>
          <div class="tag-detail-val" style="color:var(--rd)">${brl(g.out)}</div>
        </div>
        <div class="tag-detail-item">
          <div class="tag-detail-lbl">Transações</div>
          <div class="tag-detail-val">${g.count}</div>
        </div>
        <div class="tag-detail-item">
          <div class="tag-detail-lbl">Saldo</div>
          <div class="tag-detail-val" style="color:${net>=0?'var(--gr)':'var(--rd)'}">${net>=0?'+ ':'- '}${brl(Math.abs(net))}</div>
        </div>
      </div>
    </div>
    <div class="cv-sec" style="margin-top:12px">
      <div class="cv-sec-title"><span>Movimentações</span><span>${g.count}</span></div>
      <div class="cv-card">${txRows||'<div style="padding:16px;color:var(--t3);font-size:14px">Sem movimentações</div>'}</div>
    </div>`;
    return;
  }

  _selTag=null;

  if(!tagNames.length){
    el.innerHTML=`
    <div class="tags-hdr"><h2>Tags · ${mStr(_yr,_mo)}</h2></div>
    <div class="empty">Nenhuma tag neste mês.<br><br>Ao adicionar uma movimentação,<br>toque em uma tag para classificá-la.</div>`;
    return;
  }

  // Chips coloridos no topo
  const chipsHtml=tagNames.map((tag,i)=>{
    const color=TAG_COLORS[i%TAG_COLORS.length];
    const g=tagMap[tag];
    return `<button class="tag-chip" style="background:${color}18;color:${color};border:1.5px solid ${color}50"
      onclick="_selTag='${tag.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}';renderTags()">
      ${esc(tag)} <span class="tag-chip-count">${g.count}</span>
    </button>`;
  }).join('');

  // Lista com totais
  const listHtml=tagNames.map((tag,i)=>{
    const color=TAG_COLORS[i%TAG_COLORS.length];
    const g=tagMap[tag];
    const net=g.in-g.out;
    return `<div class="tag-all-row" onclick="_selTag='${tag.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}';renderTags()">
      <span class="tag-dot" style="background:${color}"></span>

  el.innerHTML=`

  <div class="mcard" style="margin-top:8px;margin-bottom:16px">
    <div class="mcard-rows" style="border-top:none">${listHtml}</div>
  </div>`;
}

function renderContas(){
  const el=document.getElementById('contas-content');
  if(!el) return;

  const today=new Date();
  const todayDay=(_yr===today.getFullYear()&&_mo===today.getMonth())?today.getDate():32;

  function isPago(amount){
    return _txs.some(t=>{
      const tp=t.type;
      const paid=(tp==='saida'||tp==='expense'||tp==='cartao'||tp==='card');
      return paid && Math.abs(parseFloat(t.amount)-amount)<0.05;
    });
  }

  function dayBadge(day, pago){
    if(pago) return `<div class="cv-day ok"><div class="cv-day-n">${day}</div><div class="cv-day-s">PAGO</div></div>`;
    if(day<todayDay) return `<div class="cv-day at"><div class="cv-day-n">${day}</div><div class="cv-day-s">ATRASO</div></div>`;
    if(day===todayDay) return `<div class="cv-day hj"><div class="cv-day-n">${day}</div><div class="cv-day-s">HOJE</div></div>`;
    return `<div class="cv-day"><div class="cv-day-n">${day}</div><div class="cv-day-s">DIA</div></div>`;
  }

  const fcHtml=_fixedCosts.map(c=>{
    const day=c.due_day||1;
    const pago=isPago(parseFloat(c.amount));
    return `<div class="cv-item">
      ${dayBadge(day,pago)}
      <div class="cv-body">
        <div class="cv-name">${esc(c.description)}</div>
        <div class="cv-sub">${esc(c.category||'')}</div>
      </div>
      <div class="cv-amt" style="color:${pago?'var(--gr)':'var(--rd)'}">${brl(parseFloat(c.amount))}</div>
    </div>`;
  }).join('');

  const subHtml=_subs.map(s=>{
    const day=s.billing_day||1;
    return `<div class="cv-item">
      ${dayBadge(day,false)}
      <div class="cv-body">
        <div class="cv-name">${esc(s.emoji||'📱')} ${esc(s.name)}</div>
        <div class="cv-sub">${esc(s.card||'')}</div>
      </div>
      <div class="cv-amt" style="color:var(--rd)">${brl(parseFloat(s.amount))}</div>
    </div>`;
  }).join('');

  const byCard={};
  _installs.forEach(i=>{
    const card=i.card||'Cartão';
    if(!byCard[card]) byCard[card]={total:0,items:[]};
    byCard[card].items.push(i);
    byCard[card].total+=parseFloat(i.installment_amount);
  });

  const instHtml=Object.entries(byCard).map(([card,g])=>{
    const rows=g.items.map(i=>`<div class="cv-item">
      <div class="cv-day"><div class="cv-day-n">${i.current_installment}</div><div class="cv-day-s">/${i.total_installments}</div></div>
      <div class="cv-body">
        <div class="cv-name">${esc(i.emoji||'🛒')} ${esc(i.description)}</div>
        <div class="cv-sub">${i.current_installment}/${i.total_installments} parcelas</div>
      </div>
      <div class="cv-amt" style="color:var(--bl)">${brl(parseFloat(i.installment_amount))}/mês</div>
    </div>`).join('');
    return `<div class="cv-sec">
      <div class="cv-sec-title"><span>${esc(card)}</span><span style="color:var(--rd)">${brl(g.total)}/mês</span></div>
      <div class="cv-card">${rows}</div>
    </div>`;
  }).join('');

  const totalFixas=_fixedCosts.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalSubs=_subs.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const totalInst=_installs.reduce((s,c)=>s+parseFloat(c.installment_amount||0),0);

  el.innerHTML=`
  <div class="cv-hdr"><h2>Contas</h2></div>
  <div class="cv-comprom">
    <div class="cv-comprom-title">Comprometimento Mensal</div>
    <div class="cv-comprom-grid">
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Fixas</div><div class="cv-comprom-val">${brl(totalFixas)}</div></div>
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Assinaturas</div><div class="cv-comprom-val">${brl(totalSubs)}</div></div>
      <div class="cv-comprom-item"><div class="cv-comprom-lbl">Parcelamentos</div><div class="cv-comprom-val">${brl(totalInst)}</div></div>
    </div>
    <div class="cv-comprom-total">
      <span class="cv-comprom-total-lbl">Total comprometido</span>
      <span class="cv-comprom-total-val">${brl(totalFixas+totalSubs+totalInst)}</span>
    </div>
  </div>
  ${_fixedCosts.length?`<div class="cv-sec">
    <div class="cv-sec-title"><span>Contas Fixas</span><span style="color:var(--rd)">${brl(totalFixas)}/mês</span></div>
    <div class="cv-card">${fcHtml}</div>
  </div>`:''}
  ${_subs.length?`<div class="cv-sec">
    <div class="cv-sec-title"><span>Assinaturas</span><span style="color:var(--rd)">${brl(totalSubs)}/mês</span></div>
    <div class="cv-card">${subHtml}</div>
  </div>`:''}
  ${instHtml}`;
}

function openAdd(){
  _editId = null;
  document.getElementById('add-btn').textContent='Salvar';
  const today=dStr(_yr,_mo,Math.min(_now.getDate(),dim(_yr,_mo)));
  document.getElementById('add-date').value=today;
  document.getElementById('add-amt').value='';
  document.getElementById('add-desc').value='';
  document.getElementById('add-cat').value='';
  document.getElementById('add-tag-input').value='';

  // Renderizar sugestões de tags populares
  const suggest=document.getElementById('add-tags-suggest');
  if(suggest){
    suggest.innerHTML=POPULAR_TAGS.map(tag=>
      `<button class="add-tag-pill" onclick="toggleTagPill(this,'${tag}')">${tag}</button>`
    ).join('');
  }

  // reset tipo para income
  _atype='income';
  document.querySelectorAll('.atype').forEach(b=>b.classList.remove('on'));
  document.querySelector('.atype').classList.add('on');
  const c=TYPE_COLORS.income;
  const sheet=document.querySelector('.add-sheet');
  sheet.style.setProperty('--cur-color', c.color);
  sheet.style.setProperty('--cur-bg', c.bg);

  document.getElementById('add-modal').classList.remove('off');
  setTimeout(()=>document.getElementById('add-amt').focus(),200);
}

function closeAdd(){ document.getElementById('add-modal').classList.add('off'); }

function toggleTagPill(el, tag){
  el.classList.toggle('sel');
  const inp=document.getElementById('add-tag-input');
  const cur=inp.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const idx=cur.indexOf(tag);
  if(idx>=0) cur.splice(idx,1); else cur.push(tag);
  inp.value=cur.join(', ');
}

document.getElementById('add-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('add-modal')) closeAdd();
});

const TYPE_COLORS={
  income:  {color:'#22C55E', bg:'rgba(34,197,94,.15)'},
  expense: {color:'#EF4444', bg:'rgba(239,68,68,.15)'},
  daily:   {color:'#EC4899', bg:'rgba(236,72,153,.15)'},
  card:    {color:'#3B82F6', bg:'rgba(59,130,246,.15)'},
  savings: {color:'#8B5CF6', bg:'rgba(139,92,246,.15)'},
};
function setAType(t,el){
  _atype=t;
  document.querySelectorAll('.atype').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const c=TYPE_COLORS[t]||TYPE_COLORS.income;
  const sheet=document.querySelector('.add-sheet');
  sheet.style.setProperty('--cur-color', c.color);
  sheet.style.setProperty('--cur-bg', c.bg);
}

async function submitAdd(){
  const amt=parseFloat(document.getElementById('add-amt').value);
  const desc=document.getElementById('add-desc').value.trim();
  const date=document.getElementById('add-date').value;
  const cat=document.getElementById('add-cat').value.trim();
  const tagsRaw=document.getElementById('add-tag-input').value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).join(','):null;

  if(!amt||!desc||!date){ alert('Preencha valor, descrição e data'); return; }
  const btn=document.getElementById('add-btn');
  btn.textContent='Salvando...'; btn.disabled=true;
  try {
    const payload={ description:desc, amount:Math.abs(amt), type:_atype, date, category:cat||TIPO_LBL[_atype], tags };
    let r;
    if(_editId){
      r = await fetch(`${SUPA_URL}/rest/v1/transactions?id=eq.${_editId}`, {
        method:'PATCH',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(payload)
      });
    } else {
      r = await fetch(`${SUPA_URL}/rest/v1/transactions`, {
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(payload)
      });
    }
    if(!r.ok){ const err=await r.text(); console.error(r.status,err); alert('Erro ao salvar: '+r.status); return; }
    _editId=null;
    closeAdd();
    loadData();
  } catch(e){
    console.error(e);
    alert('Erro de conexão. Verifique sua internet e tente novamente.');
  } finally {
    btn.textContent=_editId?'Atualizar':'Salvar'; btn.disabled=false;
  }
}

// ── BUSCA ──────────────────────────────────────────────────────
function applySearch(){
  _searchQ=document.getElementById('sg2-search-inp').value.trim().toLowerCase();
  const cl=document.getElementById('sg2-search-clear');
  if(cl) cl.classList.toggle('vis',_searchQ.length>0);
  renderSearchResults();
}

function clearSearch(){
  const inp=document.getElementById('sg2-search-inp');
  if(inp) inp.value='';
  _searchQ='';
  const cl=document.getElementById('sg2-search-clear');
  if(cl) cl.classList.remove('vis');
  renderSearchResults();
}

function setFilterType(t){
  _filterType=t;
  document.querySelectorAll('.sg2-chip').forEach(c=>c.classList.toggle('on',c.dataset.ft===t));
  renderSearchResults();
}

function renderSearchResults(){
  const wrap=document.getElementById('sg2-results');
  if(!wrap) return;
  const hasFilter=_searchQ||_filterType!=='all';
  if(!hasFilter){ wrap.style.display='none'; document.getElementById('sg2-table-wrap').style.display=''; return; }
  wrap.style.display='';
  document.getElementById('sg2-table-wrap').style.display='none';

  const pool=_allTxs.length?_allTxs:_txs;
  let res=pool.filter(t=>{
    const matchQ=!_searchQ||(t.description||'').toLowerCase().includes(_searchQ)||(t.category||'').toLowerCase().includes(_searchQ)||(t.tags||'').toLowerCase().includes(_searchQ);
    const matchT=_filterType==='all'||t.type===_filterType;
    return matchQ&&matchT;
  });

  const ic=(type)=>{const m={income:'↙',expense:'↗',daily:'D',card:'C',savings:'E'};return m[type]||'·';};
  const colorType=(type)=>{const m={income:'#22C55E',expense:'#EF4444',daily:'#EC4899',card:'#3B82F6',savings:'#8B5CF6'};return m[type]||'var(--t2)';};
  const sign=(type)=>['income','entrada','savings','economia'].includes(type)?'+':'-';

  const brlSaldo=v=>(v<0?'-':'')+brl(v);
  const mark=(txt)=>{
    if(!_searchQ) return esc(txt);
    const re=new RegExp('('+_searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc(txt).replace(re,'<mark class="sg2-mark">$1</mark>');
  };

  const html=res.length?res.map(t=>{
    const c=colorType(t.type);
    const amt=parseFloat(t.amount||0);
    const d=new Date(t.date+'T12:00:00');
    const sub=`${d.getDate()} ${MOS[d.getMonth()]} · ${t.category||t.type}`;
    return `<div class="sg2-res-row" onclick="openTx('${t.id}')">
      <span class="sg2-res-ic" style="background:${c}22;color:${c}">${ic(t.type)}</span>
      <div class="sg2-res-body">
        <span class="sg2-res-title">${mark(t.description||'—')}</span>
        <span class="sg2-res-sub">${sub}</span>
      </div>
      <span class="sg2-res-val" style="color:${c}">${sign(t.type)} ${brl(amt)}</span>
    </div>`;
  }).join(''):`<div class="sg2-no-res">Nenhuma movimentação encontrada</div>`;

  wrap.innerHTML=`<div class="sg2-res-count">${res.length} resultado${res.length===1?'':'s'}</div>${html}`;
}

// ── GRÁFICO ─────────────────────────────────────────────────────
function drawSaldoChart(saldoArr, daysInMo, todayDay){
  const canvas=document.getElementById('sg2-chart');
  if(!canvas) return;
  const W=canvas.offsetWidth||canvas.parentElement.offsetWidth||320;
  const H=110;
  canvas.width=W*2; canvas.height=H*2;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);

  const vals=[];
  for(let d=1;d<=daysInMo;d++) vals.push(saldoArr[d]||0);
  const minV=Math.min(...vals,0);
  const maxV=Math.max(...vals,0);
  const range=maxV-minV||1;

  const pad={l:6,r:6,t:10,b:22};
  const cW=W-pad.l-pad.r;
  const cH=H-pad.t-pad.b;

  const xOf=(i)=>pad.l+i/(daysInMo-1)*cW;
  const yOf=(v)=>pad.t+cH-(v-minV)/range*cH;

  // zero line
  const y0=yOf(0);
  ctx.strokeStyle='rgba(255,255,255,.08)';
  ctx.lineWidth=1;
  ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(pad.l,y0);ctx.lineTo(pad.l+cW,y0);ctx.stroke();

  // área past (verde)
  if(todayDay>1){
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
    grad.addColorStop(0,'rgba(34,197,94,.35)');
    grad.addColorStop(1,'rgba(34,197,94,.03)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(xOf(0),yOf(vals[0]));
    for(let i=1;i<Math.min(todayDay,daysInMo);i++) ctx.lineTo(xOf(i),yOf(vals[i]));
    ctx.lineTo(xOf(Math.min(todayDay-1,daysInMo-1)),yOf(0));
    ctx.lineTo(xOf(0),yOf(0));
    ctx.closePath();ctx.fill();
    // linha past
    ctx.strokeStyle='#22C55E';ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(xOf(0),yOf(vals[0]));
    for(let i=1;i<Math.min(todayDay,daysInMo);i++) ctx.lineTo(xOf(i),yOf(vals[i]));
    ctx.stroke();
  }

  // linha future (azul pontilhada)
  if(todayDay<daysInMo){
    const start=Math.max(todayDay-1,0);
    ctx.strokeStyle='#3B82F6';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(xOf(start),yOf(vals[start]));
    for(let i=start+1;i<daysInMo;i++) ctx.lineTo(xOf(i),yOf(vals[i]));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // dot hoje (laranja)
  if(todayDay>=1&&todayDay<=daysInMo){
    const xi=xOf(todayDay-1);
    const yi=yOf(vals[todayDay-1]);
    ctx.beginPath();ctx.arc(xi,yi,5,0,Math.PI*2);
    ctx.fillStyle='#FF5917';ctx.fill();
    ctx.strokeStyle='var(--card)';ctx.lineWidth=2;ctx.stroke();
  }

  // labels eixo X (início, meio, fim)
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.font='8px DM Sans, sans-serif';
  ctx.textAlign='center';
  const lblDays=[1,Math.ceil(daysInMo/2),daysInMo];
  lblDays.forEach(d=>{
    const xi=xOf(d-1);
    ctx.fillText(d,xi,H-4);
  });
}

// ── MULTI-MÊS ──────────────────────────────────────────────────
function toggleMultiMo(){
  _multiMo=!_multiMo;
  const btn=document.getElementById('sg2-multi-toggle');
  if(btn){ btn.classList.toggle('on',_multiMo); btn.textContent=_multiMo?'✕ 1 mês':'⊞ 2 meses'; }
  if(_multiMo) loadData(); else renderSaldos();
}
