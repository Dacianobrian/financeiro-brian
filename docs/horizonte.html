<!DOCTYPE html>

<meta charset="utf-8">

<meta name="google" content="notranslate">
<meta name="theme-color" content="#FFFFFF">
<title>horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var raw = localStorage.getItem("brian-theme");
    /* O index.html grava o tema como texto simples ("dark"); versões antigas
       gravavam JSON. Aceita os dois, senão o modo escuro não atravessa telas. */
    var choice = "system";
    if (raw) {
      if (raw === "dark" || raw === "light" || raw === "system") choice = raw;
      else choice = (JSON.parse(raw).state || {}).choice || "system";
    }
    var dark = choice === "dark" ||
      (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>

  --table-weekend-bg:#EDEDEE;

  --color-balance-green:#3A7A2F; --color-balance-mint:#1E9B68; --color-balance-sand:#A07A00;
  --color-balance-rose:#A34C4E; --color-balance-red:#8B1E20;

  --color-tag-gray:#5A5A5A; --color-tag-yellow:#6E5A17; --color-tag-red:#993B3B;

  --border-hairline:rgba(255,255,255,0.15); --color-bg-auth-splash:#662409;
  --color-text-ghost:#484D57; --icon-placeholder:#2B2E34;

  --shadow-soft:rgba(0,0,0,0.5); --color-border-error:#B82424; --icon-default-light:#484D57;
}

/* ══════════════════════════════════════════════════════════════
   RESET / BASE
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth;overscroll-behavior-x:contain}
body{margin:0;min-width:320px;min-height:100vh;background:var(--color-bg-canvas);color:var(--color-text-primary);font-family:"DM Sans",sans-serif;font-size:16px;line-height:24px;font-weight:400;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body,button,input,textarea,select{font-family:"DM Sans",sans-serif}
button,input,textarea,select{font:inherit}
a{color:inherit;text-decoration:none}
img,picture,svg,canvas{display:block;max-width:100%}
h1,h2,h3,h4,h5,h6,p{margin:0}
::selection{background:#DDFD5A;color:#0E2D23}
#root{min-height:100vh}

/* ══════════════════════════════════════════════════════════════
   SHELL
   ══════════════════════════════════════════════════════════════ */
.app-main{width:100%;min-height:100vh;padding-top:var(--banner-offset,0px);background:var(--color-bg-surface)}
.app-shell{width:100%;min-height:calc(100vh - var(--banner-offset,0px));height:calc(100vh - var(--banner-offset,0px));display:flex;background:var(--color-bg-surface);overflow:hidden}
@media(max-width:479px){.app-shell{height:calc(100dvh - var(--banner-offset,0px));min-height:calc(100dvh - var(--banner-offset,0px));flex-direction:column}}
.sidebar-wrap{display:flex;flex-shrink:0}
@media(max-width:479px){.sidebar-wrap{display:none}}
.content-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.desktop-header-wrap{display:block}
@media(max-width:479px){.desktop-header-wrap{display:none}}

/* ══════════════════════════════════════════════════════════════
   SIDEBAR (desktop)
   ══════════════════════════════════════════════════════════════ */
.sidebar{position:relative;z-index:40;width:144px;display:flex;flex-direction:column;padding:12px 0 4px;border-right:1px solid var(--border-hairline);background:var(--color-bg-surface);transition:width 260ms ease;will-change:width}
@media(max-width:479px){.sidebar{display:none}}
.sidebar.is-collapsed{width:56px}
.sidebar-logo{width:100%;display:flex;align-items:center;justify-content:flex-start;height:32px;padding:0 12px;margin-bottom:8px;border:0;background:transparent;cursor:pointer;transition:padding 260ms ease}
.sidebar.is-collapsed .sidebar-logo{justify-content:center;padding:0}
.sidebar-logo-mark{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;background:#FF5917;color:#fff;font-size:14px;line-height:24px;font-weight:700}
.sidebar-nav{display:flex;flex:1;flex-direction:column;gap:4px}
.sidebar-divider{height:1px;margin:4px 0;background:var(--border-hairline)}
.sidebar-item{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:8px;height:40px;padding:0 12px;border:0;background:transparent;color:var(--color-text-primary);font-size:14px;line-height:20px;font-weight:700;cursor:pointer;overflow:hidden;transition:padding 260ms ease,color 220ms ease}
.sidebar-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.sidebar-item.is-active{color:#FF5917}
.sidebar-item.is-active::before{background:#FF5917}
.sidebar-item:hover{background:var(--color-bg-subtle)}
.sidebar-item:focus-visible{outline:2px solid #FF5917;outline-offset:-2px}
.sidebar.is-collapsed .sidebar-item{justify-content:center;padding:0}
.sidebar-collapse{justify-content:flex-end;margin-top:auto}
.sidebar-label{display:inline-block;white-space:nowrap;overflow:hidden;max-width:72px;opacity:1;transform:translateX(0);transition:max-width 260ms ease,opacity 220ms ease,transform 260ms ease}
.sidebar.is-collapsed .sidebar-label{max-width:0;opacity:0;transform:translateX(-8px)}
.sidebar-icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-icon::before{content:"";width:24px;height:24px;background-color:currentColor;-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.sidebar-icon.ic-saldos::before{-webkit-mask-image:var(--ic-grid);mask-image:var(--ic-grid)}
.sidebar-icon.ic-totais::before{-webkit-mask-image:var(--ic-totals);mask-image:var(--ic-totals)}
.sidebar-icon.ic-tags::before{-webkit-mask-image:var(--ic-tags);mask-image:var(--ic-tags)}
.sidebar-icon.ic-menu::before{-webkit-mask-image:var(--ic-menu);mask-image:var(--ic-menu)}
.sidebar-icon.ic-collapse::before{-webkit-mask-image:var(--ic-dbl-left);mask-image:var(--ic-dbl-left)}
.sidebar.is-collapsed .sidebar-icon.ic-collapse::before{-webkit-mask-image:var(--ic-dbl-right);mask-image:var(--ic-dbl-right)}
.sidebar-add{position:relative;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background-color:var(--color-text-primary)}
.sidebar-add::after{content:"";width:14px;height:14px;background-color:var(--color-bg-surface);-webkit-mask-image:var(--ic-plus);mask-image:var(--ic-plus);-webkit-mask-size:14px 14px;mask-size:14px 14px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* glifo "ir pra hoje" */
.today-glyph{position:relative;width:24px;height:24px;flex-shrink:0}
.today-glyph .tg-pin-l{position:absolute;top:2px;left:5px;width:3px;height:2px;background:var(--color-text-primary)}
.today-glyph .tg-pin-r{position:absolute;top:2px;left:16px;width:3px;height:2px;background:var(--color-text-primary)}
.today-glyph .tg-bar{position:absolute;top:4px;left:2px;width:20px;height:2px;background:#FF5917}
.today-glyph .tg-num{position:absolute;top:6px;left:2px;width:20px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:0 0 2px 2px;background:var(--color-bg-subtle);color:var(--color-text-primary);font-size:12px;line-height:16px;font-weight:700}
/* mini-grade horizonte */
.horizon-mini{box-sizing:border-box;width:24px;height:24px;display:grid;grid-template-columns:20px;grid-template-rows:repeat(3,6px);gap:1px;padding:2px;flex-shrink:0;overflow:hidden;background:var(--color-bg-surface)}
.horizon-mini > span:first-child{border-radius:4px 4px 0 0}
.horizon-mini > span:last-child{border-radius:0 0 4px 4px}
.hm-neutral{background:var(--color-bg-subtle)}
.hm-lowest{background:var(--color-balance-red)}
.hm-low{background:var(--color-balance-rose)}
.hm-base{background:var(--color-balance-sand)}
.hm-high{background:var(--color-balance-mint)}
.hm-highest{background:var(--color-balance-green)}

/* ══════════════════════════════════════════════════════════════
   HEADER DESKTOP
   ══════════════════════════════════════════════════════════════ */
.desktop-header{text-transform:lowercase;min-height:56px;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--border-hairline);background:var(--color-bg-surface)}
.dh-title-wrap{flex:1 1 0;min-width:0;display:flex;align-items:center}
.dh-title{color:var(--color-text-primary);font-size:20px;line-height:24px;font-weight:700;white-space:nowrap}
.dh-nav{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;gap:8px}
.dh-nav-btn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.dh-nav-btn:hover{background:var(--color-bg-subtle)}
.dh-nav-btn:focus-visible{outline:2px solid #FF5917;outline-offset:4px}
.dh-nav-btn::before{content:"";width:24px;height:24px;background-color:#91949A;-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.dh-nav-btn.nav-dbl-prev::before{-webkit-mask-image:var(--ic-dbl-left);mask-image:var(--ic-dbl-left)}
.dh-nav-btn.nav-prev::before{-webkit-mask-image:var(--ic-chevron-left);mask-image:var(--ic-chevron-left)}
.dh-nav-btn.nav-next::before{-webkit-mask-image:var(--ic-chevron-right);mask-image:var(--ic-chevron-right)}
.dh-nav-btn.nav-dbl-next::before{-webkit-mask-image:var(--ic-dbl-right);mask-image:var(--ic-dbl-right)}
.dh-range-pill{min-width:clamp(200px,18vw,250px);height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px 0 14px;border:2px solid var(--color-border-subtle);border-radius:999px;background:var(--color-bg-surface);cursor:pointer}
.dh-range-pill:focus-visible{outline:2px solid #FF5917;outline-offset:2px}
.dh-range-label{color:var(--color-text-primary);font-size:16px;line-height:20px;font-weight:700;white-space:nowrap}
.dh-chevron{width:24px;height:24px;flex-shrink:0;background-color:#91949A;-webkit-mask-image:var(--ic-chevron-down);mask-image:var(--ic-chevron-down);-webkit-mask-size:24px 24px;mask-size:24px 24px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

/* ══════════════════════════════════════════════════════════════
   HEADER MOBILE
   ══════════════════════════════════════════════════════════════ */
.mobile-header{text-transform:lowercase;display:none}

<script>
/* ══════════════════════════════════════════════════════════════

const SB_URL = 'https://cathhujdhocioybdpnvc.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhdGhodWpkaG9jaW95YmRwbnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTUxODgsImV4cCI6MjA5MTI5MTE4OH0.5zO8sxWV1R_fVt9FPN4bDGXaCophee4gCh0jjEVp9DQ';

/* localStorage seguro: navegação privada, webviews e data: URLs bloqueiam Storage. */
const ls = {
  get(k, fallback = null){ try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch(e){ return fallback; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  json(k, fallback){ try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch(e){ return fallback; } },
};

/* Referência que define as faixas de cor do saldo.
   b < -R           → vermelho  (lowest)
   -R <= b < 0      → rosa      (low)
   0 <= b <= R      → areia     (base)
   R < b <= 2R      → menta     (high)
   b > 2R           → verde     (highest)                     */
const REFERENCIA = Number(ls.get('brian-referencia')) || 1000;

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_CAP = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const METRICS = [
  { key:'income',    label:'entradas',  icon:'mi-income'    },
  { key:'expense',   label:'saídas',    icon:'mi-expense'   },
  { key:'recurring', label:'diários',   icon:'mi-recurring' },
  { key:'savings',   label:'economias', icon:'mi-savings'   },
  { key:'card',      label:'cartão',    icon:'mi-card'      },
];

/* ══════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════ */
const HOJE = new Date();
const HOJE_KEY = iso(HOJE);

const S = {
  ano: HOJE.getFullYear(),
  mes: HOJE.getMonth(),
  offset: 0,   /* deslocamento da janela, em meses */
  metric: ls.get('brian-saldos-metric', 'card'),
  collapsed: new Set(ls.json('brian-saldos-collapsed', [])),
  checkins: new Set(ls.json('brian-checkins', [])),
  movs: [],
  saldoInicial: 0,
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function diasNoMes(y,m){ return new Date(y, m+1, 0).getDate(); }
function fmt(v){
  const n = Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (v < 0 ? '-R$ ' : 'R$ ') + n;
}
function tone(saldo){
  if (saldo < -REFERENCIA)  return 'lowest';
  if (saldo < 0)            return 'low';
  if (saldo <= REFERENCIA)  return 'base';
  if (saldo <= REFERENCIA*2)return 'high';
  return 'highest';
}
function metricInfo(key){ return METRICS.find(m => m.key === key) || METRICS[4]; }

/* ══════════════════════════════════════════════════════════════
   CLASSIFICAÇÃO — mesma regra do index.html
   ══════════════════════════════════════════════════════════════ */
function classify(mv){
  if (mv.tipo === 'entrada')                       return 'income';
  if (mv.conta === 'cartao')                       return 'card';
  if (mv.conta === 'itau' || mv.tag === 'invest')  return 'savings';
  if (mv.tag === 'diário' || mv.tag === 'diario')  return 'recurring';
  return 'expense';
}
/* ══════════════════════════════════════════════════════════════
   DADOS
   ══════════════════════════════════════════════════════════════ */
const DEMO = [
  { data:'2026-08-17', valor:1000,  tipo:'entrada', conta:'nubank' },
  { data:'2026-08-19', valor:9000,  tipo:'entrada', conta:'nubank' },
  { data:'2026-08-20', valor:19.21, tipo:'entrada', conta:'nubank' },
  { data:'2026-08-24', valor:250,   tipo:'entrada', conta:'nubank' },
  { data:'2026-08-24', valor:7600,  tipo:'saida',   conta:'nubank' },
  { data:'2026-08-26', valor:400,   tipo:'saida',   conta:'nubank' },
  { data:'2026-08-28', valor:2000,  tipo:'saida',   conta:'nubank' },
  { data:'2026-08-30', valor:300,   tipo:'saida',   conta:'nubank' },
  { data:'2026-09-03', valor:4000,  tipo:'entrada', conta:'nubank' },
  { data:'2026-09-06', valor:3800,  tipo:'saida',   conta:'nubank' },
  { data:'2026-09-12', valor:150,   tipo:'saida',   conta:'nubank' },
  { data:'2026-09-15', valor:1000,  tipo:'entrada', conta:'nubank' },
  { data:'2026-09-22', valor:10000, tipo:'saida',   conta:'nubank' },
  { data:'2026-10-25', valor:9000,  tipo:'saida',   conta:'nubank' },
  { data:'2026-11-25', valor:9000,  tipo:'saida',   conta:'nubank' },
  { data:'2026-12-25', valor:9000,  tipo:'saida',   conta:'nubank' },
];

function toMov(r){
  return {
    valor: parseFloat(r.valor),
    tipo:  r.tipo,
    data:  new Date(r.data + 'T12:00:00'),
    conta: r.conta,
    tag:   r.tag || null,
    rec:   r.rec || null,
  };
}

/* ══════════════════════════════════════════════════════════════
   JANELA DE 14 MESES — 2 passados + atual + 11 futuros
   ══════════════════════════════════════════════════════════════ */
const JANELA = 14;
const PASSADOS = 2;

function mesesDaJanela(){
  const base = HOJE.getMonth() + S.offset - PASSADOS;
  const out = [];
  for (let i = 0; i < JANELA; i++){
    const d = new Date(HOJE.getFullYear(), base + i, 1);
    out.push({ y: d.getFullYear(), m: d.getMonth() });
  }
  return out;
}

/* Saldo diário acumulado. O acumulado começa antes da janela: sem isso o
   primeiro mês exibido apareceria zerado em vez de continuar o histórico. */
function saldosDiarios(meses){
  const porDia = new Map();
  for (const mv of S.movs){
    const k = iso(mv.data);
    porDia.set(k, (porDia.get(k) || 0) + (mv.tipo === 'entrada' ? mv.valor : -mv.valor));
  }
  const inicio = iso(new Date(meses[0].y, meses[0].m, 1));

  let saldo = S.saldoInicial;
  for (const [k, delta] of [...porDia.entries()].sort()){
    if (k < inicio) saldo += delta;
  }

  return meses.map(({ y, m }) => {
    const n = diasNoMes(y, m);
    const dias = [];
    for (let d = 1; d <= n; d++){
      const k = iso(new Date(y, m, d));
      saldo += (porDia.get(k) || 0);
      dias.push({ d, key: k, saldo, tone: tone(saldo) });
    }
    return { y, m, n, dias, fecha: dias[n-1] };
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Compacto o bastante para a coluna, sem perder a ordem de grandeza:
   3.969,21 → 3,97k   |   -36.870,79 → -36,87k   |   169,21 → 169,21
   Arredondar para "4k" mentiria sobre o valor; o título traz os centavos. */
function fmtCurto(v){
  const abs = Math.abs(v);
  const sinal = v < 0 ? '-' : '';
  const num = (x, casas) => x.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
  if (abs >= 1000000) return sinal + num(abs/1000000, 2) + 'M';
  if (abs >= 1000)    return sinal + num(abs/1000, 2) + 'k';
  return sinal + num(abs, 2);
}

function render(){
  const meses = mesesDaJanela();
  const dados = saldosDiarios(meses);
  const hojeY = HOJE.getFullYear(), hojeM = HOJE.getMonth(), hojeD = HOJE.getDate();

  let thead = '<thead><tr>';
  for (const { y, m } of dados){
    const atual = y === hojeY && m === hojeM;
    thead += `<th class="hz-mth-hdr${atual ? ' is-current' : ''}" colspan="2" scope="col"` +
             `${atual ? ' data-current-month="true"' : ''}>` +
             `<span class="hz-mth">${MESES[m]}/${String(y).slice(2)}</span></th>`;
  }
  thead += '</tr></thead>';

  let tbody = '<tbody>';
  for (let d = 1; d <= 31; d++){
    const linhaHoje = d === hojeD;
    tbody += `<tr class="hz-row${linhaHoje ? ' is-today' : ''}">`;
    for (const mes of dados){
      if (d > mes.n){
        tbody += '<td class="hz-day is-empty"></td><td class="hz-bal is-empty"></td>';
        continue;
      }
      const dia = mes.dias[d-1];
      const ehHoje = dia.key === HOJE_KEY;
      tbody += `<td class="hz-day${ehHoje ? ' is-today' : ''}">${d}</td>`;
      tbody += `<td class="hz-bal tone-${dia.tone}" tabindex="0" role="button"` +
               ` data-date="${dia.key}" title="${esc(fmt(dia.saldo))}">${esc(fmtCurto(dia.saldo))}</td>`;
    }
    tbody += '</tr>';
  }
  tbody += '</tbody>';

  let tfoot = '<tfoot><tr>';
  for (const mes of dados){
    const f = mes.fecha;
    tfoot += '<td class="hz-foot-lbl">Σ</td>';
    tfoot += `<td class="hz-foot-bal tone-${f.tone}" title="${esc(fmt(f.saldo))}">${esc(fmtCurto(f.saldo))}</td>`;
  }
  tfoot += '</tr></tfoot>';

  document.getElementById('hzTable').innerHTML = thead + tbody + tfoot;

  const pri = dados[0], ult = dados[dados.length-1];
  const rotulo = `${MESES[pri.m]}/${pri.y} - ${MESES[ult.m]}/${ult.y}`;
  document.getElementById('rangeLabel').textContent       = rotulo;
  document.getElementById('mobileMonthLabel').textContent = `${MESES_CAP[pri.m]} - ${MESES_CAP[ult.m]}`;
  document.getElementById('sidebarTodayNum').textContent  = hojeD;
  document.getElementById('mobileTodayNum').textContent   = hojeD;
  document.title = `horizonte · ${rotulo}`;

  paintHorizonte(dados);
}

/* mini-grades do header, alimentadas pelos mesmos dados da tabela */
function paintHorizonte(dados){
  const futuros = dados.flatMap(m => m.dias).filter(d => d.key >= HOJE_KEY);
  const pick = n => Array.from({length:n}, (_,i) => futuros[Math.floor(i * futuros.length / n)] || null);
  const celulas = ds => ds.map(d =>
    `<span class="hm-${d ? d.tone : 'neutral'}"${d ? ` data-horizon-date="${d.key}"` : ''}></span>`).join('');
  document.getElementById('sidebarHorizon').innerHTML = celulas(pick(3));
  document.getElementById('mobileHorizon').innerHTML  = celulas(pick(9));
}

/* Centraliza o mês atual — é o ponto de leitura natural da tela. */
function irParaHoje(){
  S.offset = 0;
  render();
  requestAnimationFrame(() => {
    const wrap = document.getElementById('hzWrap');
    const th = document.querySelector('[data-current-month="true"]');
    if (!wrap || !th) return;
    const alvo = th.getBoundingClientRect().left - wrap.getBoundingClientRect().left + wrap.scrollLeft
               - (wrap.clientWidth - th.getBoundingClientRect().width) / 2;
    wrap.scrollLeft = Math.max(0, alvo);
  });
}

/* ══════════════════════════════════════════════════════════════
   EVENTOS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    const dir = navBtn.dataset.nav;
    if (dir === 'month-prev') S.offset -= 1;
    if (dir === 'month-next') S.offset += 1;
    if (dir === 'year-prev')  S.offset -= 12;
    if (dir === 'year-next')  S.offset += 12;
    render();
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act){
    if (act.dataset.action === 'today') irParaHoje();
    if (act.dataset.action === 'add')   location.href = 'index.html#add';
    return;
  }

  const cel = e.target.closest('.hz-bal[data-date]');
  if (cel){
    location.href = 'saldos.html#' + cel.dataset.date;
    return;
  }

  const collapseBtn = e.target.closest('#collapseBtn');
  if (collapseBtn){
    document.getElementById('sidebar').classList.toggle('is-collapsed');
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const cel = e.target.closest('.hz-bal[data-date]');
  if (!cel) return;
  e.preventDefault();
  location.href = 'saldos.html#' + cel.dataset.date;
});


async function boot(){
  try {
    const sb = window.supabase.createClient(SB_URL, SB_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      const { data, error } = await sb.from('movimentos').select('*').order('data', { ascending: true });
      if (!error && data) S.movs = data.map(toMov);
    }
  } catch (err) {
    console.warn('Supabase indisponível, usando dados de demonstração.', err);
  }
  if (!S.movs.length) S.movs = DEMO.map(toMov);
  irParaHoje();
}

boot();
</script>
