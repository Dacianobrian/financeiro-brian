name: Supabase Keep-Alive

# Roda automaticamente a cada 3 dias às 10h UTC (07h horário de Brasília)
# Garante que o projeto Supabase nunca fique 7 dias sem atividade
on:
  schedule:
    - cron: '0 13 */3 * *'   # a cada 3 dias — 10h horário de Brasília
  workflow_dispatch:           # permite rodar manualmente se precisar

jobs:
  ping:
    name: Manter Supabase ativo
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          # Consulta a tabela protegida por RLS. Sem sessão o RLS devolve lista
          # vazia — nenhum dado sai daqui, e o projeto conta como ativo.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://cathhujdhocioybdpnvc.supabase.co/rest/v1/movimentos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Status HTTP: $HTTP_STATUS"

          # Qualquer resposta HTTP do Supabase (inclusive 401) prova que o projeto
          # está de pé. Só 5xx ou ausência de resposta indicam problema real.
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Supabase ativo e respondendo."
          else
            echo "⚠️ Supabase retornou status inesperado: $HTTP_STATUS"
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Log horário do ping
        run: |
          echo "🕐 Ping realizado em: $(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (horário de Brasília)')"
